syntax = "proto3";

package codediver.v1;

service CodeDiverService {
  rpc Search (SearchRequest) returns (SearchResponse);
  rpc Info (InfoRequest) returns (InfoResponse);
  rpc ReadExcerpt (ReadExcerptRequest) returns (ReadExcerptResponse);
  rpc Grep (GrepRequest) returns (GrepResponse);
  rpc Symbols (SymbolsRequest) returns (SymbolsResponse);
  rpc Tree (TreeRequest) returns (TreeResponse);
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchItem {
  string path = 1;
  float score = 2;
  int32 start_line = 3;
  int32 end_line = 4;
  string title = 5;
  string content = 6;
}

message SearchResponse {
  repeated SearchItem items = 1;
}

message InfoRequest {}

message InfoResponse {
  string json_payload = 1;
}

message ReadExcerptRequest {
  string file = 1;
  int32 start_line = 2;
  int32 lines = 3;
}

message ReadExcerptResponse {
  string content = 1;
}

message GrepRequest {
  string pattern = 1;
  string path = 2;
  int32 limit = 3;
  bool regex = 4;
}

message GrepMatch {
  string path = 1;
  int32 line = 2;
  string text = 3;
}

message GrepResponse {
  repeated GrepMatch matches = 1;
}

message SymbolsRequest {
  string path = 1;
  int32 limit = 2;
}

message CodeSymbol {
  string name = 1;
  string kind = 2;
  string path = 3;
  int32 start_line = 4;
  int32 end_line = 5;
}

message SymbolsResponse {
  repeated CodeSymbol symbols = 1;
}

message TreeRequest {
  string path = 1;
  int32 depth = 2;
  int32 limit = 3;
}

message TreeResponse {
  string tree = 1;
}
