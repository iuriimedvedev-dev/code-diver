root: ../protogen
artifact: .code-diver/protogen-symbols-index.json

storage:
  provider: json

embedding:
  provider: hash
  dimensions: 256
  batch_size: 64
  workers: 4

indexing:
  mode: scanner
  ai:
    tree_depth: 4
    tree_limit: 800

scanner:
  include:
    - README.md
    - pyproject.toml
    - Dockerfile
    - docker-compose*.yml
    - src/*.py
    - src/**/*.py
    - evals/*.yaml
    - scripts/*.py
    - frontend/package.json
  exclude:
    - .claude/**
    - .codex/**
    - .opencode/**
    - frontend/node_modules/**
    - generated/**
    - htmlcov/**
    - logs/**
    - workspaces/**
    - src/app/**
    - src/templates/**
    - src/tests/**
    - src/themes/**
    - test_generated/**
    - test_codex_cli/**
    - "*.db"
    - "*.history*"
    - "*.png"
    - ".env*"
  max_file_bytes: 500000
  chunk_lines: 120
  symbol_chunks: true

search:
  limit: 10
  preview_lines: 10
  strategy: vector

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

graph:
  enabled: true
  artifact: .code-diver/protogen-symbols-graph.json
  expansion_depth: 1
  neighbor_limit: 20

trace:
  enabled: true
  artifact: .code-diver/traces/protogen-symbols-indexing.jsonl
  include_prompts: true

evaluation:
  dataset: datasets/protogen_eval.jsonl
  limit: 10

experiments:
  suite: protogen-symbols
  strategies:
    - vector
    - recursive
    - graph

metrics:
  enabled: false

plugins: []
