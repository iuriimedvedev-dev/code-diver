# H45 arm C: graph OFF and cross-encoder OFF -- the IntelliJ winner, ported to protogen.
#
# SEARCH AXIS ONLY -- one query in, top-10 files out. No query planner, no answer generation.
# The champion's protogen numbers are all citation-based, so its search-axis recall on these
# 247 cases has never been measured; that is why arm A (graph on) is run as a control rather
# than reused from an older report.
#
# Ported verbatim from protogen-h29-xenc-strict-cite.yml except for the noted variable and the
# added evaluation.dataset (the answer pipeline supplies its cases separately).
#
# Two variables vs arm A, one vs arm B: search.strategy graph_file_cross_encoder -> graph_file.
#
# On IntelliJ this configuration dominated the champion on both axes (+0.0319 recall,
# +0.0699 MRR, 2.9x faster). Arm C tests whether that also holds on the corpus the champion
# was tuned on -- the strongest possible test of the retirement claim.
#
# --- inherited from protogen-h29-xenc-strict-cite.yml ---
# H28: replace the generative rerank stage with a dedicated cross-encoder.
#
# One change from protogen-h17-ctrl.yml: `search.strategy` moves from `graph_file_rerank` to
# `graph_file_cross_encoder`. Same collection, same graph artifact, same answer model, same
# retrieval pool -- only the primitive that orders the 34 candidates differs.
#
# Why: the final LLM rerank measures 17.5 s/case, 26% of the 66.7 s total, and Finding 33 shows
# that stage -- not retrieval -- is what caps quality (pool recall 0.908 at depth 60 collapses to
# 0.745 measured file recall). A cross-encoder scores each (query, document) pair independently
# with no generation at all, so it attacks both axes at once.
#
# Requires: llama-server --model .code-diver/models/rerankers/qwen3-reranker-0.6b/Qwen3-Reranker-0.6B-Q4_K_M.gguf \
#             --host 127.0.0.1 --port 8081 --embedding --reranking --pooling rank
# See docs/llama-cpp-rerank-runtime-notes-2026-06-02.md before touching the tuned flags.

root: ../protogen

storage:
  provider: qdrant
  qdrant:
    url: http://localhost:6333
    collection: code_diver_h17_ctrl
    batch_size: 256

embedding:
  provider: openai_compatible
  model: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  dimensions:
  url: http://127.0.0.1:8001/v1/embeddings
  api_key: local
  batch_size: 128
  workers: 1
  max_input_chars: 400
  query_prefix: "Represent this code and repository documentation search query: "
  document_prefix: "Represent this file-level code or documentation metadata for retrieval: "

generation:
  provider: openai_compatible
  model: mlx-community/Qwen3.5-4B-OptiQ-4bit
  url: http://127.0.0.1:8012/v1/chat/completions
  api_key: local
  temperature: 0
  max_tokens: 2048
  timeout_ms: 240000
  response_format: json_schema
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  retry_attempts: 2
  retry_base_delay_seconds: 2
  retry_max_delay_seconds: 10

pi:
  repo_context:
    enabled: true
    mode: llm_readme_summary
    output: .code-diver/context/protogen-h14-qwen4b-repository-context.md
    include_docs: true
    max_chars: 16000
    docs_limit: 12

search:
  limit: 10
  preview_lines: 8
  strategy: graph_file   # H45-C: no cross-encoder

scanner:
  line_chunks: false
  structural_chunks: false
  symbol_chunks: false
  symbol_body: false
  file_summary_chunks: true
  file_manifest_chunks: true
  file_api_manifest_chunks: false
  file_body_evidence_chunks: false
  documentation_summary_chunks: true
  documentation_manifest_chunks: true
  documentation_chunk_chunks: true
  max_symbols_per_file: 96

hybrid_search:
  candidate_limit: 360
  lexical_candidate_limit: 1000
  vector_weight: 0.42
  lexical_weight: 0.26
  path_weight: 0.12
  symbol_weight: 0.10
  symbol_match_weight: 0.10
  graph_weight: 0.0
  file_vote_weight: 0.06
  graph_depth: 0
  graph_neighbor_limit: 0
  vector_kind_limits:
    file_summary: 170
    file_manifest: 170
    doc_summary: 36
    doc_manifest: 24
    doc_chunk: 48
  vector_kind_multipliers:
    file_summary: 1.0
    file_manifest: 1.08
    doc_summary: 0.72
    doc_manifest: 0.58
    doc_chunk: 0.64
  routing_enabled: true
  lexical_scoring: bm25
  fusion: weighted
  preserve_vector_top: true
  vector_top_score_margin: 0.03
  item_kind_weights:
    file_summary: 1.0
    file_manifest: 1.08
    doc_summary: 0.72
    doc_manifest: 0.58
    doc_chunk: 0.64
  min_token_length: 3

graph_file_search:
  seed_limit: 140
  lexical_seed_limit: 280
  vector_weight: 0.25
  lexical_weight: 0.25
  path_weight: 0.20
  symbol_weight: 0.10
  graph_weight: 0.0   # H45-C
  depth: 2
  neighbor_limit: 40
  decay: 0.65
  min_token_length: 3

# Inert under `graph_file_cross_encoder` -- kept verbatim from the champion so the two files
# diff cleanly and so switching `search.strategy` back needs no other edit.
llm_rerank:
  candidate_limit: 34
  rerank_limit: 10
  max_preview_chars: 850
  mode: precision
  include_reasons: false
  preserve_top_candidate: false
  retry_attempts: 3
  retry_base_delay_seconds: 1.0
  retry_max_delay_seconds: 8.0
  repository_context_max_chars: 16000

cross_encoder_rerank:
  provider: llama_cpp
  model: Qwen3-Reranker-0.6B
  # :8080 is taken by an unrelated jbcc-api listener on this machine, so the reranker
  # gets :8081. The docs' known-good command names 8080; only the port differs.
  url: http://127.0.0.1:8081/v1/rerank
  # Matched to `llm_rerank` above: same list depth, same per-candidate text budget, same
  # top-preservation policy. Anything else here would confound the primitive swap.
  candidate_limit: 34
  max_document_chars: 850
  preserve_top_candidate: false
  # The June notes warn that 34-40 documents is slow locally on the 4B; the 0.6B is the arm
  # being measured, and 60 s leaves room for a cold first request without masking a real stall.
  timeout_ms: 60000

graph:
  enabled: true
  artifact: .code-diver/protogen-h17-ctrl.json
  ast_enabled: false
  reference_edges_enabled: true
  call_edges_enabled: false
  expansion_depth: 2
  neighbor_limit: 40

evaluation:
  dataset: datasets/protogen_eval_247.jsonl
  limit: 10
  workers: 1
  # Finding 38: h28 kept the cross-encoder's 22pp latency reclaim but broke the
  # `citation_fabricated_rate` guardrail (0.025 -> 0.053, bound 0.035) without retrieving any
  # worse -- it reordered the bundle, the prompt changed, and the model cited real repo files
  # it had not been shown. This names the citable set in the prompt. h29 is the pair of runs
  # that tells us whether that fixes the guardrail without costing the primary.
  restrict_citations_to_context: true

metrics:
  enabled: false
