root: ../protogen
artifact: .code-diver/protogen-ollama-qdrant-index.json

storage:
  provider: qdrant
  qdrant:
    location: .code-diver/qdrant-ollama-v2
    collection: protogen_ollama_embeddings
    batch_size: 256

embedding:
  provider: openai_compatible
  model: mxbai-embed-large
  dimensions:
  url: http://127.0.0.1:11434/v1/embeddings
  api_key: ollama
  batch_size: 1
  workers: 4
  max_input_chars: 400

generation:
  provider: vertex
  model: gemini-3.5-flash
  fallback_models:
    - gemini-3-flash-preview
    - gemini-2.5-flash
  location: global
  temperature: 0
  thinking_budget: 1024
  api_version: v1
  timeout_ms: 20000

indexing:
  mode: scanner

scanner:
  include:
    - README.md
    - pyproject.toml
    - Dockerfile
    - docker-compose*.yml
    - src/*.py
    - src/**/*.py
    - evals/*.yaml
    - scripts/*.py
    - frontend/package.json
  exclude:
    - .claude/**
    - .codex/**
    - .opencode/**
    - frontend/node_modules/**
    - generated/**
    - htmlcov/**
    - logs/**
    - workspaces/**
    - src/app/**
    - src/templates/**
    - src/tests/**
    - src/themes/**
    - test_generated/**
    - test_codex_cli/**
    - "*.db"
    - "*.history*"
    - "*.png"
    - ".env*"
  max_file_bytes: 500000
  chunk_lines: 180
  structural_chunks: true
  symbol_chunks: true
  file_summary_chunks: true

search:
  limit: 10
  preview_lines: 10
  strategy: vector

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

hybrid_search:
  candidate_limit: 80
  lexical_candidate_limit: 80
  vector_weight: 0.6
  lexical_weight: 0.18
  path_weight: 0.12
  symbol_weight: 0.05
  symbol_match_weight: 0.0
  graph_weight: 0.05
  file_vote_weight: 0.04
  graph_depth: 1
  graph_neighbor_limit: 20
  item_kind_weights:
    file_summary: 0.82
    symbol: 1.04
    structural_chunk: 0.72
    chunk: 1.05
  min_token_length: 3

llm_rerank:
  candidate_limit: 40
  max_preview_chars: 700
  mode: file_first
  include_reasons: true

cross_encoder_rerank:
  provider: llama_cpp
  model: Qwen3-Reranker-0.6B
  url: http://127.0.0.1:8080/v1/rerank
  candidate_limit: 40
  max_document_chars: 900
  timeout_ms: 20000
  preserve_top_candidate: false

graph:
  enabled: true
  artifact: .code-diver/protogen-ollama-qdrant-graph.json
  ast_enabled: true
  reference_edges_enabled: true
  call_edges_enabled: true
  expansion_depth: 1
  neighbor_limit: 20

pi:
  binary: npx
  launcher_args:
    - -y
    - "@earendil-works/pi-coding-agent"
  extension: .pi/extensions/code-diver-rag.ts
  prompt_template: .pi/prompts/code-diver-rag.md
  provider: google
  model: google/gemini-3.5-flash
  fallback_models:
    - google/gemini-3-flash-preview
    - google/gemini-2.5-flash
  timeout_seconds: 90
  tools:
    - code_diver_search
    - code_diver_inspect
    - code_diver_open
    - code_diver_evaluate
    - code_diver_tree
    - code_diver_grep
    - code_diver_rg
    - code_diver_read
    - code_diver_symbols
    - code_diver_rerank
  toolsets:
    vector_search:
      - code_diver_search
      - code_diver_inspect
      - code_diver_open
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
      - code_diver_evaluate
      - code_diver_rerank
    grep_search:
      - code_diver_inspect
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
  extra_args: []

trace:
  enabled: true
  artifact: .code-diver/traces/protogen-ollama-qdrant-indexing.jsonl
  include_prompts: true

evaluation:
  dataset: datasets/protogen_eval_100.jsonl
  limit: 10

experiments:
  suite: protogen-ollama-qdrant
  strategies:
    - vector
    - recursive
    - graph
    - hybrid
    - hybrid_rerank
  hypotheses:
    - name: vector_qdrant
      strategy: vector
      toolset: vector_search
      description: Qdrant vector retrieval with mxbai embeddings.
    - name: recursive_qdrant
      strategy: recursive
      toolset: vector_search
      description: Multi-round Qdrant vector retrieval.
    - name: graph_ast_qdrant
      strategy: graph
      toolset: vector_search
      description: AST GraphRAG expansion over Qdrant results.
    - name: hybrid_candidates_no_llm
      strategy: hybrid
      description: Deterministic vector, lexical, path, symbol, and graph candidate fusion without LLM turns.
    - name: hybrid_candidates_lexical
      strategy: hybrid
      hybrid_search:
        candidate_limit: 80
        lexical_candidate_limit: 120
        vector_weight: 0.35
        lexical_weight: 0.35
        path_weight: 0.2
        symbol_weight: 0.05
        graph_weight: 0.05
        graph_depth: 1
        graph_neighbor_limit: 20
        min_token_length: 3
      description: Deterministic fusion with stronger lexical and path signals.
    - name: hybrid_candidates_graph_boost
      strategy: hybrid
      hybrid_search:
        candidate_limit: 80
        lexical_candidate_limit: 80
        vector_weight: 0.5
        lexical_weight: 0.15
        path_weight: 0.1
        symbol_weight: 0.05
        graph_weight: 0.2
        graph_depth: 2
        graph_neighbor_limit: 30
