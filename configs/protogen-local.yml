root: ../protogen
artifact: .code-diver/protogen-local-index.json

storage:
  provider: json

embedding:
  provider: openai_compatible
  # LM Studio: load an embedding model and use the exact model id from /v1/models.
  # Ollama OpenAI-compatible server usually accepts pulled model names.
  model: nomic-embed-text
  dimensions:
  url: http://127.0.0.1:1234/v1/embeddings
  api_key: local
  batch_size: 1
  workers: 4
  max_input_chars: 400

generation:
  provider: openai_compatible
  # Good M3 Max starting points:
  # - qwen3-coder-next / qwen3-coder for coding orchestration if available
  # - gpt-oss-20b for general local orchestration
  model: qwen3-coder
  url: http://127.0.0.1:1234/v1/chat/completions
  api_key: local
  temperature: 0

indexing:
  mode: orchestrated
  ai:
    tree_depth: 4
    tree_limit: 800

scanner:
  include:
    - README.md
    - pyproject.toml
    - Dockerfile
    - docker-compose*.yml
    - src/*.py
    - src/**/*.py
    - evals/*.yaml
    - scripts/*.py
    - frontend/package.json
  exclude:
    - .claude/**
    - .codex/**
    - .opencode/**
    - frontend/node_modules/**
    - generated/**
    - htmlcov/**
    - logs/**
    - workspaces/**
    - src/app/**
    - src/templates/**
    - src/tests/**
    - src/themes/**
    - test_generated/**
    - test_codex_cli/**
    - "*.db"
    - "*.history*"
    - "*.png"
    - ".env*"
  max_file_bytes: 500000
  chunk_lines: 180

search:
  limit: 10
  preview_lines: 10
  strategy: orchestrated

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

graph:
  enabled: true
  artifact: .code-diver/protogen-local-graph.json
  expansion_depth: 1
  neighbor_limit: 20

evaluation:
  dataset: datasets/protogen_eval.jsonl
  limit: 10

experiments:
  suite: protogen-local-models
  strategies:
    - orchestrated
    - vector
    - recursive
    - graph

metrics:
  enabled: true
  url: http://localhost:18123
  database: code_diver
  username: code_diver
  password: code_diver
  docker_container: code-diver-clickhouse
  metrics_table: rag_eval_metrics
  cases_table: rag_eval_cases
  timeout_seconds: 10
  retention_days: 30

plugins: []
