# H49a: family-size penalty arm (H-A only).
#
# EXACTLY ONE mechanism differs from intellij-h46-preserve-top.yml:
#   hybrid_search.family_penalty_enabled: false -> true
#   (plus its threshold knobs, all at their coded defaults so this documents them explicitly)
#
# Targets the where-bucket root cause: siblings in the same directory (e.g. RenameHandler.java
# vs RenameProcessor.java) that share every path/symbol token the query has get identical or
# near-identical path_score/symbol_score/symbol_match_score. That is 32% of the fused score
# (path_weight 0.12 + symbol_weight 0.10 + symbol_match_weight 0.10) contributing ZERO
# discrimination between them, so vector+lexical -- often weak on realistic developer
# questions -- ends up picking the winner essentially by chance.
#
# Mechanism (HybridRetrievalStrategy._apply_family_penalty, hybrid_retrieval_strategy.py):
# candidates are grouped into "families" by (path_score, symbol_score). Families with
# >= family_penalty_min_family_size members have their path_score/symbol_score/
# symbol_match_score multiplied by (min_family_size / family_size) ** family_penalty_strength --
# i.e. the more siblings tie, the more their shared path/symbol contribution is dampened,
# forcing the fused score to lean on vector+lexical for exactly those candidates. Families
# smaller than the threshold (the normal shape for mechanical queries, where the correct file's
# path/symbol match is unique) are untouched -- the penalty cannot fire on them at all.
#
# Everything else -- hybrid weights, candidate_limit, cross_encoder_rerank block, graph block --
# is verbatim from the champion.

root: ../intellij-community

storage:
  provider: qdrant
  qdrant:
    url: http://localhost:6333
    collection: intellij_community_file_manifest_local_qwen
    batch_size: 1024

embedding:
  provider: openai_compatible
  model: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  dimensions:
  url: http://127.0.0.1:8001/v1/embeddings
  api_key: local
  batch_size: 128
  workers: 4
  max_input_chars: 500

search:
  limit: 10
  preview_lines: 8
  strategy: graph_file_cross_encoder

generation:
  provider: openai_compatible
  model: mlx-community/Qwen3.5-4B-OptiQ-4bit
  url: http://127.0.0.1:8012/v1/chat/completions
  api_key: local
  temperature: 0
  max_tokens: 2048
  timeout_ms: 240000

indexing:
  mode: scanner

scanner:
  include:
    - README.md
    - CONTRIBUTING.md
    - build.gradle
    - build.gradle.kts
    - settings.gradle
    - settings.gradle.kts
    - "**/*.java"
    - "**/*.kt"
    - "**/*.kts"
    - "**/*.xml"
    - "**/*.properties"
    - "**/*.gradle"
    - "**/*.gradle.kts"
    - "**/*.md"
    - "**/*.json"
    - "**/*.yaml"
    - "**/*.yml"
  exclude:
    - .idea/**
    - .gradle/**
    - .ijwb/**
    - bazel-*/**
    - build/**
    - out/**
    - "**/build/**"
    - "**/out/**"
    - "**/test/**"
    - "**/tests/**"
    - "**/testData/**"
    - "**/testdata/**"
    - "**/generated/**"
    - "**/gen/**"
    - "**/.cache/**"
    - "**/node_modules/**"
  line_chunks: false
  structural_chunks: false
  symbol_chunks: false
  symbol_body: false
  file_summary_chunks: true
  file_manifest_chunks: true
  max_symbols_per_file: 96

# Champion weights, plus the H49 family-size penalty (the single changed variable vs h46).
hybrid_search:
  candidate_limit: 360
  lexical_candidate_limit: 1000
  vector_weight: 0.42
  lexical_weight: 0.26
  path_weight: 0.12
  symbol_weight: 0.10
  symbol_match_weight: 0.10
  graph_weight: 0.0
  file_vote_weight: 0.06
  graph_depth: 0
  graph_neighbor_limit: 0
  vector_kind_limits:
    file_summary: 170
    file_manifest: 170
  vector_kind_multipliers:
    file_summary: 1.0
    file_manifest: 1.08
  routing_enabled: true
  lexical_scoring: bm25
  fusion: weighted
  preserve_vector_top: true
  vector_top_score_margin: 0.03
  item_kind_weights:
    file_summary: 1.0
    file_manifest: 1.08
  min_token_length: 3
  # H49: the single changed variable vs h46.
  family_penalty_enabled: true
  family_penalty_min_family_size: 3
  family_penalty_score_tolerance: 0.0
  family_penalty_strength: 1.0

graph_file_search:
  seed_limit: 140
  lexical_seed_limit: 280
  vector_weight: 0.25
  lexical_weight: 0.25
  path_weight: 0.20
  symbol_weight: 0.10
  graph_weight: 0.0
  depth: 2
  neighbor_limit: 40
  decay: 0.65
  min_token_length: 3

cross_encoder_rerank:
  provider: llama_cpp
  model: Qwen3-Reranker-0.6B
  url: http://127.0.0.1:8081/v1/rerank
  candidate_limit: 34
  max_document_chars: 850
  preserve_top_candidate: true
  preserve_top_score_margin: 0.1
  timeout_ms: 60000

graph:
  enabled: true
  artifact: .code-diver/intellij-h37-jvm-graph.json
  ast_enabled: false
  reference_edges_enabled: false
  call_edges_enabled: false
  expansion_depth: 2
  neighbor_limit: 40

trace:
  enabled: false

evaluation:
  dataset: datasets/intellij_eval_1000.answer_sets.jsonl
  limit: 10
  workers: 1

metrics:
  enabled: false
