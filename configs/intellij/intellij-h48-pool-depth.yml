# H48: is the large-repo loss in candidate GENERATION or in RANKING?
#
# Identical to configs/intellij/intellij-h43-graph-off-no-xenc.yml except for one line:
#   search.limit: 10 -> 200   (and evaluation.limit to match)
#
# Why this arm exists. On IntelliJ (74 906 files) the best arm to date reaches
# file_recall@10 0.8958 (H38) while the same stack reaches 0.9025 on protogen (1911 files)
# and 0.9730 on CodeSearchNet. Per-case mining of the three finished 1000-case arms
# (champion / H38 / H43) says the misses are mostly NOT shared: 148 cases have zero recall in
# at least one arm but only 60 in all three. So at least 88 of the misses are a ranking
# accident, and the irreducible core is ~6%. That is an upper bound on what reranking can
# ever fix -- it does not tell us whether the answer is in the candidate pool at all.
#
# This arm answers exactly that. The strategy, the fusion weights, the seed limits and the
# pool cap (hybrid_search.candidate_limit: 360) are H43's, byte for byte; only the number of
# results returned changes. The per-case `retrieved_files` list therefore holds H43's own
# pool, 200 deep, and recall@k for every k <= 200 is arithmetic on the saved report -- no
# extra retrieval, no model calls beyond the query embedding.
#
# Pre-registered prediction: file_recall@200 >= 0.95. The candidate pool contains the answer
# and the loss is in ranking, which is attackable with a better ranker or a deeper rerank
# window.
#
# Refutation condition: file_recall@200 < 0.90, i.e. less than 3 points above H43's
# file_recall@10 of 0.8716. That would mean the pool itself does not contain the answer at a
# 74 906-file scale -- candidate generation (embedding of file summaries, lexical seeding,
# the 170-per-kind vector limits) is then the bottleneck and no reranker can repair it.
#
# Latency from this arm is void by construction: limit 200 changes nothing in retrieval cost
# but the run shares a machine with an idle generator holding a multi-GB prompt cache, and
# Finding 37 stands -- machine state is a multiplicative factor on wall clock.

root: ../intellij-community

storage:
  provider: qdrant
  qdrant:
    url: http://localhost:6333
    collection: intellij_community_file_manifest_local_qwen
    batch_size: 1024

embedding:
  provider: openai_compatible
  model: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  dimensions:
  url: http://127.0.0.1:8001/v1/embeddings
  api_key: local
  batch_size: 128
  workers: 4
  max_input_chars: 500

search:
  limit: 200   # H48: the single changed variable vs H43
  preview_lines: 8
  strategy: graph_file

generation:
  provider: openai_compatible
  model: mlx-community/Qwen3.5-4B-OptiQ-4bit
  url: http://127.0.0.1:8012/v1/chat/completions
  api_key: local
  temperature: 0
  max_tokens: 2048
  timeout_ms: 240000

indexing:
  mode: scanner

scanner:
  include:
    - README.md
    - CONTRIBUTING.md
    - build.gradle
    - build.gradle.kts
    - settings.gradle
    - settings.gradle.kts
    - "**/*.java"
    - "**/*.kt"
    - "**/*.kts"
    - "**/*.xml"
    - "**/*.properties"
    - "**/*.gradle"
    - "**/*.gradle.kts"
    - "**/*.md"
    - "**/*.json"
    - "**/*.yaml"
    - "**/*.yml"
  exclude:
    - .idea/**
    - .gradle/**
    - .ijwb/**
    - bazel-*/**
    - build/**
    - out/**
    - "**/build/**"
    - "**/out/**"
    - "**/testSrc/**"
    - "**/testSources/**"
    - "**/platform-tests/**"
    - "**/test/**"
    - "**/tests/**"
    - "**/testData/**"
    - "**/testdata/**"
    - "**/generated/**"
    - "**/gen/**"
    - "**/.cache/**"
    - "**/node_modules/**"
  line_chunks: false
  structural_chunks: false
  symbol_chunks: false
  symbol_body: false
  file_summary_chunks: true
  file_manifest_chunks: true
  max_symbols_per_file: 96

hybrid_search:
  candidate_limit: 360
  lexical_candidate_limit: 1000
  vector_weight: 0.42
  lexical_weight: 0.26
  path_weight: 0.12
  symbol_weight: 0.10
  symbol_match_weight: 0.10
  graph_weight: 0.0
  file_vote_weight: 0.06
  graph_depth: 0
  graph_neighbor_limit: 0
  vector_kind_limits:
    file_summary: 170
    file_manifest: 170
  vector_kind_multipliers:
    file_summary: 1.0
    file_manifest: 1.08
  routing_enabled: true
  lexical_scoring: bm25
  fusion: weighted
  preserve_vector_top: true
  vector_top_score_margin: 0.03
  item_kind_weights:
    file_summary: 1.0
    file_manifest: 1.08
  min_token_length: 3

graph_file_search:
  seed_limit: 140
  lexical_seed_limit: 280
  vector_weight: 0.25
  lexical_weight: 0.25
  path_weight: 0.20
  symbol_weight: 0.10
  graph_weight: 0.0
  depth: 2
  neighbor_limit: 40
  decay: 0.65
  min_token_length: 3

cross_encoder_rerank:
  provider: llama_cpp
  model: Qwen3-Reranker-0.6B
  url: http://127.0.0.1:8081/v1/rerank
  candidate_limit: 34
  max_document_chars: 850
  preserve_top_candidate: false
  timeout_ms: 60000

graph:
  enabled: true
  artifact: .code-diver/intellij-h37-jvm-graph.json
  ast_enabled: false
  reference_edges_enabled: false
  call_edges_enabled: false
  expansion_depth: 2
  neighbor_limit: 40

trace:
  enabled: false

evaluation:
  dataset: datasets/intellij_eval_1000.answer_sets.jsonl
  limit: 200
  workers: 1

metrics:
  enabled: false
