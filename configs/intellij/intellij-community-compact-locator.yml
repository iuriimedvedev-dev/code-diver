root: ../intellij-community
artifact: .code-diver/intellij-community-compact-locator-index.json

storage:
  provider: qdrant
  qdrant:
    url: http://localhost:6333
    collection: intellij_community_compact_locator
    batch_size: 1024

embedding:
  provider: vertex
  model: gemini-embedding-001
  dimensions: 768
  project: "236777862453"
  location: global
  batch_size: 32
  workers: 1
  max_input_chars: 400
  retry_attempts: 4
  retry_delay_seconds: 20

generation:
  provider: vertex
  model: gemini-3.5-flash
  fallback_models:
    - gemini-3-flash-preview
    - gemini-2.5-flash
  project: "236777862453"
  location: global
  temperature: 0
  thinking_budget: 1024
  api_version: v1
  timeout_ms: 30000

indexing:
  mode: scanner

scanner:
  include:
    - README.md
    - CONTRIBUTING.md
    - build.gradle
    - build.gradle.kts
    - settings.gradle
    - settings.gradle.kts
    - "**/*.java"
    - "**/*.kt"
    - "**/*.kts"
    - "**/*.xml"
    - "**/*.properties"
    - "**/*.gradle"
    - "**/*.gradle.kts"
    - "**/*.md"
    - "**/*.json"
    - "**/*.yaml"
    - "**/*.yml"
  exclude:
    - .idea/**
    - .gradle/**
    - .ijwb/**
    - bazel-*/**
    - build/**
    - out/**
    - dist/**
    - target/**
    - "**/build/**"
    - "**/out/**"
    - "**/test/**"
    - "**/tests/**"
    - "**/testData/**"
    - "**/testdata/**"
    - "**/generated/**"
    - "**/gen/**"
    - "**/.cache/**"
    - "**/node_modules/**"
    - "**/*.class"
    - "**/*.jar"
    - "**/*.zip"
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.jpeg"
    - "**/*.gif"
    - "**/*.ico"
    - "**/*.svg"
  max_file_bytes: 1000000
  line_chunks: false
  chunk_lines: 220
  structural_chunks: false
  symbol_chunks: true
  symbol_body: false
  file_summary_chunks: true
  max_symbols_per_file: 12

search:
  limit: 10
  preview_lines: 10
  strategy: hybrid

hybrid_search:
  candidate_limit: 260
  lexical_candidate_limit: 520
  vector_weight: 0.44
  lexical_weight: 0.24
  path_weight: 0.14
  symbol_weight: 0.10
  symbol_match_weight: 0.10
  graph_weight: 0.06
  file_vote_weight: 0.08
  graph_depth: 1
  graph_neighbor_limit: 64
  vector_kind_limits:
    file_summary: 140
    symbol: 140
  vector_kind_multipliers:
    file_summary: 1.08
    symbol: 1.02
  routing_enabled: true
  lexical_scoring: bm25
  fusion: weighted
  preserve_vector_top: true
  vector_top_score_margin: 0.03
  item_kind_weights:
    file_summary: 1.10
    symbol: 1.04
  min_token_length: 3

llm_rerank:
  candidate_limit: 24
  max_preview_chars: 420
  mode: file_first
  include_reasons: true

graph:
  enabled: true
  artifact: .code-diver/intellij-community-compact-locator-graph.json
  ast_enabled: true
  reference_edges_enabled: true
  call_edges_enabled: false
  expansion_depth: 1
  neighbor_limit: 64

trace:
  enabled: true
  artifact: .code-diver/traces/intellij-community-compact-locator.jsonl
  include_prompts: true

evaluation:
  dataset: datasets/intellij_eval_1000.jsonl
  limit: 10
  workers: 4

experiments:
  suite: intellij-community-compact-locator
  strategies:
    - hybrid
    - hybrid_rerank
  hypotheses:
    - name: intellij_compact_locator
      strategy: hybrid
      description: File-summary plus signature-only symbols; no full code bodies in vector payloads.
    - name: intellij_compact_locator_rrf
      strategy: hybrid
      hybrid_search:
        fusion: rrf
        candidate_limit: 260
        lexical_candidate_limit: 520
        routing_enabled: true
        preserve_vector_top: true
      description: Same compact index with reciprocal rank fusion.
    - name: intellij_compact_locator_lexical_heavy
      strategy: hybrid
      hybrid_search:
        candidate_limit: 260
        lexical_candidate_limit: 700
        vector_weight: 0.34
        lexical_weight: 0.32
        path_weight: 0.18
        symbol_weight: 0.12
        symbol_match_weight: 0.12
        graph_weight: 0.04
        file_vote_weight: 0.08
        routing_enabled: true
        preserve_vector_top: true
      description: Compact index with stronger BM25/path/symbol pressure.
    - name: intellij_compact_locator_graph_heavy
      strategy: hybrid
      hybrid_search:
        candidate_limit: 320
        lexical_candidate_limit: 520
        vector_weight: 0.38
        lexical_weight: 0.22
        path_weight: 0.12
        symbol_weight: 0.10
        symbol_match_weight: 0.10
        graph_weight: 0.14
        file_vote_weight: 0.08
        graph_depth: 2
        graph_neighbor_limit: 96
        routing_enabled: true
        preserve_vector_top: true
      description: Compact index with stronger graph expansion.
    - name: intellij_compact_locator_no_graph
      strategy: hybrid
      hybrid_search:
        graph_weight: 0.0
        graph_depth: 0
        routing_enabled: true
        preserve_vector_top: true
      description: Compact index without graph contribution.
    - name: intellij_compact_locator_flash_lite_rerank
      strategy: hybrid_rerank
      generation:
        provider: vertex
        model: gemini-3.1-flash-lite
        fallback_models: []
        project: "236777862453"
        location: global
        temperature: 0
        thinking_budget: 256
        api_version: v1
        timeout_ms: 30000
      llm_rerank:
        candidate_limit: 24
        max_preview_chars: 420
        mode: file_first
        include_reasons: true
      description: Compact locator candidates verified by a cheap LLM reranker.

metrics:
  enabled: false

plugins: []
