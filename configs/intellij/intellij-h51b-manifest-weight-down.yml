# H51b: de-weight file_manifest, isolated from H51's max_input_chars change.
#
# EXACTLY TWO fields differ from intellij-h46-preserve-top.yml, both dropping
# file_manifest from its current 1.08x up-weight to 1.0x (parity with file_summary):
#   hybrid_search.vector_kind_multipliers.file_manifest: 1.08 -> 1.0
#   hybrid_search.item_kind_weights.file_manifest:        1.08 -> 1.0
#
# Motivation (task #63, secondary knob under H-2): research this session found
# file_manifest is the more path/package/directory-preamble-polluted of the two
# per-file vector kinds, yet it is currently weighted 8% ABOVE file_summary in both
# the retrieval-time vector fusion (vector_kind_multipliers) and the final per-item
# fusion (item_kind_weights). If file_manifest's embedded content is disproportionately
# preamble rather than symbol signal, up-weighting it is upweighting noise.
#
# Why this is a separate, zero-reindex config rather than combined with H51: both
# vector_kind_multipliers and item_kind_weights are pure retrieval-time hybrid-search
# fusion weights (src/code_diver/strategies/hybrid_candidate_scorer.py) -- they only
# affect how already-computed scores are combined, never what gets embedded or stored.
# Changing them requires no re-index, no server restart, nothing but a config edit, so
# it is tested here alone (same collection as the champion, read-only) to keep it
# independently attributable rather than confounded with H51's max_input_chars change,
# per task #63's explicit instruction to keep the two knobs' effects distinguishable.
# If both individually help, a combined H51+H51b config is a natural next step.

root: ../intellij-community

storage:
  provider: qdrant
  qdrant:
    url: http://localhost:6333
    collection: intellij_community_file_manifest_local_qwen
    batch_size: 1024

# Verbatim from intellij-postrank-h3-manifest.yml -- must match how the collection was built.
embedding:
  provider: openai_compatible
  model: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  dimensions:
  url: http://127.0.0.1:8001/v1/embeddings
  api_key: local
  batch_size: 128
  workers: 4
  max_input_chars: 500

search:
  limit: 10
  preview_lines: 8
  strategy: graph_file_cross_encoder

# Unused on the search axis (no generation), kept so the file loads standalone.
generation:
  provider: openai_compatible
  model: mlx-community/Qwen3.5-4B-OptiQ-4bit
  url: http://127.0.0.1:8012/v1/chat/completions
  api_key: local
  temperature: 0
  max_tokens: 2048
  timeout_ms: 240000

indexing:
  mode: scanner

# Verbatim from intellij-postrank-h3-manifest.yml. Not exercised by `evaluate` (nothing is
# re-indexed) but it is what the collection and the graph artifact were produced from, so a
# divergence here is a silent staleness bug waiting to happen.
scanner:
  include:
    - README.md
    - CONTRIBUTING.md
    - build.gradle
    - build.gradle.kts
    - settings.gradle
    - settings.gradle.kts
    - "**/*.java"
    - "**/*.kt"
    - "**/*.kts"
    - "**/*.xml"
    - "**/*.properties"
    - "**/*.gradle"
    - "**/*.gradle.kts"
    - "**/*.md"
    - "**/*.json"
    - "**/*.yaml"
    - "**/*.yml"
  exclude:
    - .idea/**
    - .gradle/**
    - .ijwb/**
    - bazel-*/**
    - build/**
    - out/**
    - "**/build/**"
    - "**/out/**"
    - "**/testSrc/**"
    - "**/testSources/**"
    - "**/platform-tests/**"
    - "**/test/**"
    - "**/tests/**"
    - "**/testData/**"
    - "**/testdata/**"
    - "**/generated/**"
    - "**/gen/**"
    - "**/.cache/**"
    - "**/node_modules/**"
  line_chunks: false
  structural_chunks: false
  symbol_chunks: false
  symbol_body: false
  file_summary_chunks: true
  file_manifest_chunks: true
  max_symbols_per_file: 96

# file_manifest de-weighted to parity (1.0) here -- the one change vs. the champion.
hybrid_search:
  candidate_limit: 360
  lexical_candidate_limit: 1000
  vector_weight: 0.42
  lexical_weight: 0.26
  path_weight: 0.12
  symbol_weight: 0.10
  symbol_match_weight: 0.10
  graph_weight: 0.0
  file_vote_weight: 0.06
  graph_depth: 0
  graph_neighbor_limit: 0
  vector_kind_limits:
    file_summary: 170
    file_manifest: 170
  vector_kind_multipliers:
    file_summary: 1.0
    file_manifest: 1.0
  routing_enabled: true
  lexical_scoring: bm25
  fusion: weighted
  preserve_vector_top: true
  vector_top_score_margin: 0.03
  item_kind_weights:
    file_summary: 1.0
    file_manifest: 1.0
  min_token_length: 3

# Champion block, verbatim.
graph_file_search:
  seed_limit: 140
  lexical_seed_limit: 280
  vector_weight: 0.25
  lexical_weight: 0.25
  path_weight: 0.20
  symbol_weight: 0.10
  graph_weight: 0.0
  depth: 2
  neighbor_limit: 40
  decay: 0.65
  min_token_length: 3

# Champion block, verbatim.
cross_encoder_rerank:
  provider: llama_cpp
  model: Qwen3-Reranker-0.6B
  url: http://127.0.0.1:8081/v1/rerank
  candidate_limit: 34
  max_document_chars: 850
  preserve_top_candidate: true
  preserve_top_score_margin: 0.1
  timeout_ms: 60000

graph:
  enabled: true
  artifact: .code-diver/intellij-h37-jvm-graph.json
  ast_enabled: false
  reference_edges_enabled: false
  call_edges_enabled: false
  expansion_depth: 2
  neighbor_limit: 40

trace:
  enabled: false

evaluation:
  dataset: datasets/intellij_eval_1000.answer_sets.jsonl
  limit: 10
  workers: 1

metrics:
  enabled: false
