# NEW COLLECTION REQUIRED: symbol_chunk_chunks adds a whole new index kind, so the H-66b
# collection cannot be reused and a fresh one must be built at index time.
#
# H-64 chunk-level indexing: H-66b already beats the jbcontext reference on MRR, and the whole
# remaining gap is candidate recall -- the gold file exists but drowns inside a big file's single
# summary vector (ActionManagerImpl surfaced only at depth 125). jbcontext searches method/class
# chunks rather than whole files, so this config emits one extra dense point per top-level type
# and per public callable of every file over ~200 LOC, using the same compact-budget text style.
# `item.path` stays the full file path, so retrieval, dedup and path scoring remain file-level.
#
# This is a copy of intellij-h66b-budget.yml. Weights are untouched; the only differences are the
# collection, the suite label, the new scanner flag, the symbol_chunk vector lane (a kind absent
# from vector_kind_limits is never queried at all) and the per-path candidate cap that stops one
# large file's chunks from flooding the top-k.
#
# H46 is intentionally unchanged.
root: ../intellij-community

storage:
  provider: qdrant
  qdrant:
    url: http://localhost:6333
    collection: intellij_h64_chunks_qwen
    batch_size: 1024

# Verbatim from intellij-postrank-h3-manifest.yml -- must match how the collection was built.
embedding:
  provider: openai_compatible
  model: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  dimensions:
  url: http://127.0.0.1:8001/v1/embeddings
  api_key: local
  batch_size: 128
  workers: 4
  max_input_chars: 500

search:
  limit: 10
  preview_lines: 8
  strategy: graph_file_cross_encoder

# Unused on the search axis (no generation), kept so the file loads standalone.
generation:
  provider: openai_compatible
  model: mlx-community/Qwen3.5-4B-OptiQ-4bit
  url: http://127.0.0.1:8012/v1/chat/completions
  api_key: local
  temperature: 0
  max_tokens: 2048
  timeout_ms: 240000

indexing:
  mode: scanner

# Verbatim from intellij-postrank-h3-manifest.yml. This collection must be re-indexed for
# the completed source reorder to change the summary content.
scanner:
  include:
    - README.md
    - CONTRIBUTING.md
    - build.gradle
    - build.gradle.kts
    - settings.gradle
    - settings.gradle.kts
    - "**/*.java"
    - "**/*.kt"
    - "**/*.kts"
    - "**/*.xml"
    - "**/*.properties"
    - "**/*.gradle"
    - "**/*.gradle.kts"
    - "**/*.md"
    - "**/*.json"
    - "**/*.yaml"
    - "**/*.yml"
  exclude:
    - .idea/**
    - .gradle/**
    - .ijwb/**
    - bazel-*/**
    - build/**
    - out/**
    - "**/build/**"
    - "**/out/**"
    - "**/test/**"
    - "**/tests/**"
    - "**/testData/**"
    - "**/testdata/**"
    - "**/generated/**"
    - "**/gen/**"
    - "**/.cache/**"
    - "**/node_modules/**"
  line_chunks: false
  structural_chunks: false
  symbol_chunks: false
  symbol_body: false
  file_summary_chunks: true
  file_manifest_chunks: true
  file_summary_compact_budget: true
  symbol_chunk_chunks: true
  max_symbols_per_file: 96

# Champion weights, minus the doc_* kinds this collection does not contain.
hybrid_search:
  candidate_limit: 360
  lexical_candidate_limit: 1000
  vector_weight: 0.42
  lexical_weight: 0.26
  path_weight: 0.12
  symbol_weight: 0.10
  symbol_match_weight: 0.10
  graph_weight: 0.0
  file_vote_weight: 0.06
  graph_depth: 0
  graph_neighbor_limit: 0
  # symbol_chunk shares the file_summary budget: the vector lane runs one query per kind, so a
  # kind that is missing here is never retrieved.
  vector_kind_limits:
    file_summary: 170
    file_manifest: 170
    symbol_chunk: 340
  vector_kind_multipliers:
    file_summary: 1.0
    file_manifest: 1.08
    symbol_chunk: 1.0
  # One file may own up to 20 chunk points; without a cap it could take the whole candidate
  # list that the file-level stage then dedups down to a single result.
  per_path_result_limit: 3
  routing_enabled: true
  lexical_scoring: bm25
  fusion: weighted
  preserve_vector_top: true
  vector_top_score_margin: 0.03
  item_kind_weights:
    file_summary: 1.0
    file_manifest: 1.08
  min_token_length: 3

# Champion block, verbatim.
graph_file_search:
  seed_limit: 140
  lexical_seed_limit: 280
  vector_weight: 0.25
  lexical_weight: 0.25
  path_weight: 0.20
  symbol_weight: 0.10
  graph_weight: 0.0
  depth: 2
  neighbor_limit: 40
  decay: 0.65
  min_token_length: 3

# Champion block, verbatim. :8080 holds an unrelated jbcc-api listener on this machine, so
# the reranker is on :8081.
cross_encoder_rerank:
  provider: llama_cpp
  model: Qwen3-Reranker-0.6B
  url: http://127.0.0.1:8081/v1/rerank
  candidate_limit: 34
  max_document_chars: 850
  preserve_top_candidate: true
  preserve_top_score_margin: 0.1
  timeout_ms: 60000

graph:
  enabled: true
  artifact: .code-diver/intellij-h37-jvm-graph.json
  ast_enabled: false
  reference_edges_enabled: false
  call_edges_enabled: false
  expansion_depth: 2
  neighbor_limit: 40

trace:
  enabled: false

evaluation:
  dataset: datasets/intellij_eval_1000.answer_sets.jsonl
  limit: 10
  workers: 1

experiments:
  suite: h64-arm1-wide-chunk-lane

metrics:
  enabled: false
