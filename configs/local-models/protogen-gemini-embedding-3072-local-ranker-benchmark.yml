base_config: configs/protogen-legacy/protogen-ollama-qdrant.yml
output: .code-diver/reports/protogen-gemini-embedding-3072-local-ranker-benchmark.json
log_dir: .code-diver/logs/generation-models
reindex: true
port: 8012
startup_timeout_seconds: 1200
timeout_ms: 180000
memory_fraction: 0.72
config_overrides:
  storage:
    qdrant:
      url: http://localhost:6333
      location:
      collection: protogen_gemini_embedding_001_3072
      batch_size: 512
  trace:
    include_prompts: true
embedding:
  provider: vertex
  model: gemini-embedding-001
  dimensions: 3072
  api_key:
  location: global
  batch_size: 32
  workers: 1
  max_input_chars: 400
  cost_per_1m_tokens_usd: 0.15
hypotheses:
  - hybrid_candidates_symbol_first
  - hybrid_rerank_flash_lite_top20_compact
  - hybrid_rerank_flash_lite_file_first
search_config_overrides:
  llm_rerank:
    preserve_top_candidate: false
generation_models:
  - name: gemini_flash_lite_api_control
    runtime: api
    provider: vertex
    model: gemini-3.1-flash-lite
    api_key:
    location: global
    api_version: v1
    temperature: 0
    thinking_budget: 256
    timeout_ms: 30000
    precision: api
    quantization: api
  - name: qwen35_4b_mlx_4bit
    runtime: mlx_vlm
    model: mlx-community/Qwen3.5-4B-MLX-4bit
    precision: 4bit
    quantization: uniform-4bit
    port: 8012
    max_tokens: 256
  - name: qwen35_4b_mlx_bf16
    runtime: mlx_vlm
    model: mlx-community/Qwen3.5-4B-MLX-bf16
    precision: bf16
    quantization: none
    port: 8012
    max_tokens: 256
  - name: qwen35_4b_optiq_4bit
    runtime: mlx_lm
    model: mlx-community/Qwen3.5-4B-OptiQ-4bit
    precision: 4bit
    quantization: optiq-4bit
    port: 8012
    max_tokens: 256
    chat_template_args: '{"enable_thinking": false}'
  - name: gemma4_e2b_it_4bit
    runtime: mlx_vlm
    model: mlx-community/gemma-4-e2b-it-4bit
    precision: 4bit
    quantization: uniform-4bit
    port: 8012
    max_tokens: 256
  - name: gemma4_e2b_it_bf16
    runtime: mlx_vlm
    model: mlx-community/gemma-4-e2b-it-bf16
    precision: bf16
    quantization: none
    port: 8012
    max_tokens: 256
  - name: gemma4_e4b_it_4bit
    runtime: mlx_vlm
    model: mlx-community/gemma-4-e4b-it-4bit
    precision: 4bit
    quantization: uniform-4bit
    port: 8012
    max_tokens: 256
  - name: gemma4_e4b_it_bf16
    runtime: mlx_vlm
    model: mlx-community/gemma-4-e4b-it-bf16
    precision: bf16
    quantization: none
    port: 8012
    max_tokens: 256
  - name: gemma4_e4b_it_optiq_4bit
