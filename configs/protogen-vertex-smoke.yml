root: ../protogen
artifact: .code-diver/protogen-vertex-smoke-index.json

storage:
  provider: json

embedding:
  provider: vertex
  model: gemini-embedding-2
  dimensions: 768
  project: "236777862453"
  location: global
  batch_size: 1
  workers: 4
  max_input_chars: 1200
  retry_attempts: 3
  retry_delay_seconds: 10

generation:
  provider: vertex
  model: gemini-3.5-flash
  fallback_models:
    - gemini-3-flash-preview
    - gemini-2.5-flash
  project: "236777862453"
  location: global
  temperature: 0
  thinking_budget: 512
  api_version: v1
  timeout_ms: 20000

indexing:
  mode: scanner

scanner:
  include:
    - src/main.py
    - src/sessions/service.py
    - src/services/pipeline_service.py
    - src/arena/service.py
    - src/arena/runner.py
    - src/arena/evaluator.py
    - src/metrics/collector.py
    - frontend/package.json
    - evals/*.yaml
  exclude:
    - ".env*"
  max_file_bytes: 500000
  chunk_lines: 120
  symbol_chunks: true

search:
  limit: 10
  preview_lines: 10
  strategy: vector

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

graph:
  enabled: true
  artifact: .code-diver/protogen-vertex-smoke-graph.json
  ast_enabled: true
  expansion_depth: 1
  neighbor_limit: 20

trace:
  enabled: true
  artifact: .code-diver/traces/protogen-vertex-smoke-indexing.jsonl
  include_prompts: true

evaluation:
  dataset: datasets/protogen_eval.jsonl
  limit: 10

experiments:
  suite: protogen-vertex-smoke
  strategies:
    - vector
    - recursive
    - graph

metrics:
  enabled: false

plugins: []
