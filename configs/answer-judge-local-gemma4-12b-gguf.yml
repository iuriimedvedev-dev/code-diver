# Local strict answer judge, llama.cpp build.
#
# Why this exists next to `answer-judge-local-gemma4-12b.yml`: the mlx_lm in
# `.venv-vllm-metal-official` cannot serve this model at all --
# `ValueError: Model type gemma4_unified not supported`. The GGUF at
# `.code-diver/models/gemma-4-12b-it-qat-GGUF/` is served by llama-server instead, so the
# model name here is the QAT quantization actually on the wire and NOT the mlx repo id. Those
# are different quantizations of the same weights and their scores are not interchangeable;
# naming the served artifact is what lets `OpenAICompatibleGenerationProvider`'s first-response
# check catch a mix-up instead of scoring under the wrong name.
#
# Port 8030 is reserved for judges and used by no generation config, so the judge and the
# answer-generation server on :8012 can be up at once without one answering for the other.
#
# Cross-family on purpose: answers in this series are generated by Qwen3.5-4B, so a Gemma judge
# does not share the generator's blind spots. `answer-judge-local-qwen35-9b.yml` is the
# same-family control and its own header says so.
#
# Judge scores are SECONDARY until validated against the saved Gemini strict-judge answer
# reports in `.code-diver/reports/strict-judge/`. Deterministic metrics remain the search-side
# ranking criteria; the judge is the explanation-side axis, which nothing else in this series
# measures.
generation:
  provider: openai_compatible
  model: gemma-4-12B-it-qat-UD-Q4_K_XL
  url: http://127.0.0.1:8030/v1/chat/completions
  api_key: local
  temperature: 0
  max_tokens: 3072
  timeout_ms: 240000
  response_format: json_schema
  extra_body:
    # Verified against this llama-server build (b9430): without it the model emits
    # `reasoning_content` and returns an empty `content`, which parses as a zero-score row.
    chat_template_kwargs:
      enable_thinking: false
  retry_attempts: 2
  retry_base_delay_seconds: 2
  retry_max_delay_seconds: 10
