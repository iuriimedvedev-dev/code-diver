root: ../protogen
artifact: .code-diver/protogen-index.json

storage:
  provider: json
  qdrant:
    url: http://localhost:6333
    collection: code_diver_protogen
    api_key_env: QDRANT_API_KEY
    batch_size: 128

embedding:
  provider: hash
  dimensions: 256
  batch_size: 64

pi:
  binary: pi
  extension: .pi/extensions/code-diver-rag.ts
  prompt_template: .pi/prompts/code-diver-rag.md
  provider: google
  model: gemini-3.5-flash
  tools:
    - code_diver_index
    - code_diver_search
    - code_diver_open
    - code_diver_evaluate
    - code_diver_tree
    - code_diver_grep
    - code_diver_rg
  extra_args: []

scanner:
  include:
    - README.md
    - pyproject.toml
    - Dockerfile
    - docker-compose*.yml
    - src/*.py
    - src/**/*.py
    - evals/*.yaml
    - scripts/*.py
    - frontend/package.json
  exclude:
    - .claude/**
    - .codex/**
    - .opencode/**
    - frontend/node_modules/**
    - generated/**
    - htmlcov/**
    - logs/**
    - workspaces/**
    - src/app/**
    - src/templates/**
    - src/tests/**
    - src/themes/**
    - test_generated/**
    - test_codex_cli/**
    - "*.db"
    - "*.history*"
    - "*.png"
    - ".env*"
  max_file_bytes: 500000
  chunk_lines: 120

search:
  limit: 10
  preview_lines: 10
  strategy: vector

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

graph:
  enabled: true
  artifact: .code-diver/protogen-graph.json
  expansion_depth: 1
  neighbor_limit: 20

ui:
  color: true
  pager: auto
  links: true
  editor:
    command: code
    args:
      - -g
      - "{path}:{line}"

evaluation:
  dataset: datasets/protogen_eval.jsonl
  limit: 10

plugins: []
