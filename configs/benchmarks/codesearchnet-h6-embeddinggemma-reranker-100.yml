root: .code-diver/benchmarks/mteb-codesearchnet-python/corpus
artifact: .code-diver/benchmarks/mteb-codesearchnet-python/index-h5-embeddinggemma-300m-quality.json

storage:
  provider: json

embedding:
  provider: sentence_transformers
  model: google/embeddinggemma-300m
  dimensions: 768
  batch_size: 96
  workers: 1
  max_input_chars: 900
  query_prefix: "Represent this code search query for retrieving relevant files: "
  document_prefix: "Represent this code file metadata for retrieval: "

indexing:
  mode: scanner

scanner:
  include:
    - "**/*.py"
  max_file_bytes: 200000
  line_chunks: false
  structural_chunks: false
  symbol_chunks: false
  symbol_body: false
  file_summary_chunks: true
  file_manifest_chunks: true
  max_symbols_per_file: 96

search:
  limit: 10
  preview_lines: 8
  strategy: hybrid

hybrid_search:
  candidate_limit: 280
  lexical_candidate_limit: 900
  vector_weight: 0.5625
  lexical_weight: 0.1875
  path_weight: 0.08333333333333334
  symbol_weight: 0.04166666666666667
  symbol_match_weight: 0.04166666666666667
  graph_weight: 0.08333333333333334
  file_vote_weight: 0.0
  graph_depth: 0
  graph_neighbor_limit: 0
  vector_kind_limits:
    file_summary: 170
    file_manifest: 170
  vector_kind_multipliers:
    file_summary: 1.0
    file_manifest: 1.08
  routing_enabled: true
  lexical_scoring: bm25
  fusion: weighted
  preserve_vector_top: true
  vector_top_score_margin: 0.03
  item_kind_weights:
    file_summary: 1.0
    file_manifest: 1.08
  min_token_length: 3

cross_encoder_rerank:
  provider: llama_cpp
  model: Qwen3-Reranker-0.6B-Q4_K_M.gguf
  url: http://127.0.0.1:8080/v1/rerank
  api_key: local
  candidate_limit: 30
  max_document_chars: 900
  timeout_ms: 30000
  preserve_top_candidate: false
  preserve_top_score_margin: 0.0

graph:
  enabled: true
  artifact: .code-diver/benchmarks/mteb-codesearchnet-python/graph-h5-embeddinggemma-300m-quality.json
  ast_enabled: false
  reference_edges_enabled: false
  call_edges_enabled: false
  expansion_depth: 0
  neighbor_limit: 0

trace:
  enabled: true
  artifact: .code-diver/traces/codesearchnet-h6-embeddinggemma-reranker-100.jsonl
  include_prompts: false

evaluation:
  dataset: .code-diver/tmp/codesearchnet_python_100.jsonl
  limit: 10
  workers: 1

experiments:
  suite: codesearchnet-h6-embeddinggemma-reranker-100
  strategies:
    - hybrid
    - cross_encoder_rerank
  hypotheses:
    - name: h6_embeddinggemma_static
      strategy: hybrid
      description: "EmbeddingGemma H6.1 static/grid weights without reranker."
    - name: h6_embeddinggemma_qwen3_reranker_0_6b
      strategy: cross_encoder_rerank
      description: "EmbeddingGemma H6.1 candidates reranked by local Qwen3-Reranker 0.6B."

metrics:
  enabled: false

plugins: []
