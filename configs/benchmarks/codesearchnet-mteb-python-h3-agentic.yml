root: .code-diver/benchmarks/mteb-codesearchnet-python/corpus
artifact: .code-diver/benchmarks/mteb-codesearchnet-python/index-pure-h3.json

storage:
  provider: json

embedding:
  provider: hash
  dimensions: 512
  batch_size: 128
  workers: 4

indexing:
  mode: scanner

scanner:
  include:
    - "**/*.py"
  max_file_bytes: 200000
  line_chunks: false
  chunk_lines: 220
  structural_chunks: false
  symbol_chunks: false
  symbol_body: false
  file_summary_chunks: true
  file_manifest_chunks: true
  max_symbols_per_file: 96

search:
  limit: 10
  preview_lines: 8
  strategy: hybrid

hybrid_search:
  candidate_limit: 280
  lexical_candidate_limit: 900
  vector_weight: 0.34
  lexical_weight: 0.34
  path_weight: 0.18
  symbol_weight: 0.10
  symbol_match_weight: 0.10
  graph_weight: 0.0
  file_vote_weight: 0.06
  graph_depth: 0
  graph_neighbor_limit: 0
  vector_kind_limits:
    file_summary: 170
    file_manifest: 170
  vector_kind_multipliers:
    file_summary: 1.0
    file_manifest: 1.08
  routing_enabled: true
  lexical_scoring: bm25
  fusion: weighted
  preserve_vector_top: true
  vector_top_score_margin: 0.03
  item_kind_weights:
    file_summary: 1.0
    file_manifest: 1.08
  min_token_length: 3

llm_rerank:
  candidate_limit: 30
  return_limit: 10
  max_candidate_chars: 700
  mode: file_first
  include_reasons: false
  preserve_top_candidate: true
  preserve_top_score_margin: 0.03

trace:
  enabled: true
  artifact: .code-diver/traces/codesearchnet-mteb-python-h3-agentic.jsonl
  include_prompts: true

evaluation:
  dataset: .code-diver/benchmarks/mteb-codesearchnet-python/codesearchnet_python_1000.jsonl
  limit: 10
  workers: 1

experiments:
  suite: codesearchnet-mteb-python-h3-agentic
  strategies:
    - hybrid
  hypotheses:
    - name: ai_h3_agentic_gemini_flash_lite_public
      tools:
        - code_diver_h3_search
        - code_diver_outline
        - code_diver_symbols
        - code_diver_rg
        - code_diver_grep
        - code_diver_read
        - code_diver_rerank
      generation:
        provider: vertex
        model: gemini-3.1-flash-lite
        fallback_models: []
        project: "236777862453"
        location: global
        temperature: 0
        thinking_budget: 256
        api_version: v1
        timeout_ms: 30000
      description: "Public CodeSearchNet H3 Agentic with Gemini 3.1 Flash Lite."
    - name: ai_h3_agentic_qwen35_4b_public
      tools:
        - code_diver_h3_search
        - code_diver_outline
        - code_diver_symbols
        - code_diver_rg
        - code_diver_grep
        - code_diver_read
        - code_diver_rerank
      generation:
        provider: openai_compatible
        model: mlx-community/Qwen3.5-4B-OptiQ-4bit
        url: http://127.0.0.1:8012/v1/chat/completions
        api_key: local
        temperature: 0
        max_tokens: 1536
        timeout_ms: 120000
      description: "Public CodeSearchNet H3 Agentic with local Qwen3.5 4B."
    - name: ai_h3_agentic_gemma4_e4b_public
      tools:
        - code_diver_h3_search
        - code_diver_outline
        - code_diver_symbols
        - code_diver_rg
        - code_diver_grep
        - code_diver_read
        - code_diver_rerank
      generation:
        provider: openai_compatible
        model: mlx-community/gemma-4-e4b-it-OptiQ-4bit
        url: http://127.0.0.1:8012/v1/chat/completions
        api_key: local
        temperature: 0
        max_tokens: 768
        timeout_ms: 120000
      description: "Public CodeSearchNet H3 Agentic with local Gemma 4 E4B OptiQ."
    - name: ai_h3_agentic_gemma4_12b_llama_public
      tools:
        - code_diver_h3_search
        - code_diver_outline
        - code_diver_symbols
        - code_diver_rg
        - code_diver_grep
        - code_diver_read
        - code_diver_rerank
      generation:
        provider: openai_compatible
        model: gemma-4-12b-it-GGUF
        url: http://127.0.0.1:8013/v1/chat/completions
        api_key: local
        temperature: 0
        max_tokens: 1024
        response_format: json_schema
        timeout_ms: 180000
      description: "Public CodeSearchNet H3 Agentic with local Gemma 4 12B GGUF through llama.cpp."

metrics:
  enabled: false

plugins: []
