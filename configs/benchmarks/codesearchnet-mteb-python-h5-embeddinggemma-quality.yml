root: .code-diver/benchmarks/mteb-codesearchnet-python/corpus
artifact: .code-diver/benchmarks/mteb-codesearchnet-python/index-h5-embeddinggemma-300m-quality.json

storage:
  provider: json

embedding:
  provider: openai_compatible
  model: google/embeddinggemma-300m
  dimensions: 768
  api_key: local
  url: http://127.0.0.1:8001/v1/embeddings
  batch_size: 96
  workers: 4
  max_input_chars: 1200
  query_prefix: "task: code retrieval | query: "
  document_prefix: "title: none | text: "

indexing:
  mode: scanner

scanner:
  include:
    - "**/*.py"
  max_file_bytes: 200000
  line_chunks: false
  chunk_lines: 220
  structural_chunks: false
  symbol_chunks: false
  symbol_body: false
  file_summary_chunks: true
  file_manifest_chunks: true
  max_symbols_per_file: 96

search:
  limit: 10
  preview_lines: 8
  strategy: hybrid_rerank

generation:
  provider: gemini
  model: gemini-3.1-flash-lite
  fallback_models: []
  location: global
  temperature: 0
  thinking_budget: 256
  api_version: v1beta
  timeout_ms: 30000

hybrid_search:
  candidate_limit: 280
  lexical_candidate_limit: 900
  vector_weight: 0.5625
  lexical_weight: 0.1875
  path_weight: 0.08333333333333334
  symbol_weight: 0.04166666666666667
  symbol_match_weight: 0.04166666666666667
  graph_weight: 0.08333333333333334
  file_vote_weight: 0.0
  graph_depth: 0
  graph_neighbor_limit: 0
  vector_kind_limits:
    file_summary: 170
    file_manifest: 170
  vector_kind_multipliers:
    file_summary: 1.0
    file_manifest: 1.08
  routing_enabled: true
  lexical_scoring: bm25
  fusion: weighted
  preserve_vector_top: true
  vector_top_score_margin: 0.03
  item_kind_weights:
    file_summary: 1.0
    file_manifest: 1.08
  min_token_length: 3

cross_encoder_rerank:
  provider: llama_cpp
  model: Qwen3-Reranker-0.6B-Q4_K_M.gguf
  url: http://127.0.0.1:8080/v1/rerank
  api_key: local
  candidate_limit: 30
  max_document_chars: 900
  timeout_ms: 30000
  preserve_top_candidate: false
  preserve_top_score_margin: 0.0

llm_rerank:
  candidate_limit: 30
  rerank_limit: 10
  max_preview_chars: 700
  mode: precision
  include_reasons: false
  preserve_top_candidate: false

graph:
  enabled: true
  artifact: .code-diver/benchmarks/mteb-codesearchnet-python/graph-h5-embeddinggemma-300m-quality.json
  ast_enabled: false
  reference_edges_enabled: false
  call_edges_enabled: false
  expansion_depth: 0
  neighbor_limit: 0

trace:
  enabled: true
  artifact: .code-diver/traces/codesearchnet-mteb-python-h5-embeddinggemma-quality.jsonl
  include_prompts: false

evaluation:
  dataset: .code-diver/benchmarks/mteb-codesearchnet-python/codesearchnet_python_1000.jsonl
  limit: 10
  workers: 1

experiments:
  suite: codesearchnet-mteb-python-h5-embeddinggemma-quality
  strategies:
    - hybrid_rerank
  hypotheses:
    - name: h6_embeddinggemma_gemini_lite_rerank
      strategy: hybrid_rerank
      description: "Default quality profile: H6.1 EmbeddingGemma candidates reranked by Gemini 3.1 Flash Lite."
    - name: h6_embeddinggemma_no_ranker
      strategy: hybrid
      description: "Fast H6.1 candidate generation over EmbeddingGemma 300M file metadata without LLM rerank."
    - name: h6_embeddinggemma_qwen3_reranker_0_6b
      strategy: cross_encoder_rerank
      description: "EmbeddingGemma H3 candidates reranked by local Qwen3-Reranker 0.6B."

metrics:
  enabled: false

plugins: []
