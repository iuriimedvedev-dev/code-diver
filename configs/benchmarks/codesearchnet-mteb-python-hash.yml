root: .code-diver/benchmarks/mteb-codesearchnet-python/corpus
artifact: .code-diver/benchmarks/mteb-codesearchnet-python/index.json

storage:
  provider: json

embedding:
  provider: hash
  dimensions: 512
  batch_size: 128
  workers: 4

indexing:
  mode: scanner

scanner:
  include:
    - "**/*.py"
  max_file_bytes: 200000
  chunk_lines: 200
  structural_chunks: false
  symbol_chunks: false

search:
  limit: 10
  preview_lines: 8
  strategy: vector

trace:
  enabled: true
  artifact: .code-diver/traces/codesearchnet-mteb-python-hash.jsonl
  include_prompts: false

evaluation:
  dataset: .code-diver/benchmarks/mteb-codesearchnet-python/codesearchnet_python_1000.jsonl
  limit: 10

experiments:
  suite: codesearchnet-mteb-python-hash
  strategies:
    - vector

metrics:
  enabled: false

plugins: []
