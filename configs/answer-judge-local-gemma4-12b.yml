# Local strict answer judge. Replaces the Vertex Gemini judge the H14 runners hardcoded,
# which is no longer reachable.
#
# Port 8030 is reserved for judges and used by no generation config, so a judge server and
# a generation server can be up at once without one silently answering for the other.
# `OpenAICompatibleGenerationProvider` verifies the served model on the first response, so a
# stale server on this port fails the run instead of producing scores under the wrong name.
#
# Judge scores from this config are SECONDARY. Promotion is decided by the deterministic
# metrics (answer_grounded, context_bundle_complete, citation_expected_*), which no model
# can inflate. Validate this judge against the saved Gemini strict-judge scores in
# .code-diver/reports/strict-judge/ before reading its numbers as comparable.
generation:
  provider: openai_compatible
  model: mlx-community/gemma-4-12B-it-4bit
  url: http://127.0.0.1:8030/v1/chat/completions
  api_key: local
  temperature: 0
  max_tokens: 3072
  timeout_ms: 240000
  response_format: json_schema
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  retry_attempts: 2
  retry_base_delay_seconds: 2
  retry_max_delay_seconds: 10
