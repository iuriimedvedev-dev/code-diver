root: /workspace
artifact: /artifacts/index.json

storage:
  provider: qdrant
  qdrant:
    url: http://qdrant:6333
    collection: code_diver
    api_key_env: QDRANT_API_KEY
    batch_size: 128

embedding:
  provider: hash
  dimensions: 256
  batch_size: 64
  workers: 4
  max_input_chars:

generation:
  provider: gemini
  model: gemini-3.5-flash
  fallback_models:
    - gemini-3-flash-preview
    - gemini-2.5-flash
  temperature: 0
  thinking_budget: 1024
  api_version: v1alpha
  timeout_ms: 20000

indexing:
  mode: scanner
  ai:
    tree_depth: 4
    tree_limit: 800

pi:
  binary: pi-dev
  extension: /app/.pi/extensions/code-diver-rag.ts
  prompt_template: /app/.pi/prompts/code-diver-rag.md
  provider: google
  model: gemini-3.5-flash
  tools:
    - code_diver_index
    - code_diver_search
    - code_diver_inspect
    - code_diver_open
    - code_diver_evaluate
    - code_diver_experiment
    - code_diver_tree
    - code_diver_grep
    - code_diver_rg
    - code_diver_read
    - code_diver_symbols
  extra_args: []

scanner:
  include: []
  exclude:
    - .git/**
    - .env*
    - node_modules/**
    - .venv/**
    - dist/**
    - build/**
    - target/**
    - .code-diver/**
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
    - "*.gif"
    - "*.webp"
    - "*.db"
  max_file_bytes: 1000000
  chunk_lines: 120
  symbol_chunks: false

search:
  limit: 10
  preview_lines: 8
  strategy: vector

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

graph:
  enabled: true
  artifact: /artifacts/graph.json
  ast_enabled: true
  expansion_depth: 1
  neighbor_limit: 20

ui:
  color: true
  pager: never
  links: true
  editor:
    command: code
    args:
      - -g
      - "{path}:{line}"

evaluation:
  dataset: /app/datasets/sample_eval.jsonl
  limit: 10

experiments:
  suite: container
  strategies:
    - vector
    - recursive
    - graph

metrics:
  enabled: true
  url: http://clickhouse:8123
  database: code_diver
  username: code_diver
  password: code_diver
  docker_container:
  metrics_table: rag_eval_metrics
  cases_table: rag_eval_cases
  timeout_seconds: 10
  retention_days: 30

plugins: []
