root: ../protogen
artifact: .code-diver/protogen-ollama-qdrant-index.json

storage:
  provider: qdrant
  qdrant:
    location: .code-diver/qdrant-ollama-v2
    collection: protogen_ollama_embeddings
    batch_size: 256

embedding:
  provider: openai_compatible
  model: mxbai-embed-large
  dimensions:
  url: http://127.0.0.1:11434/v1/embeddings
  api_key: ollama
  batch_size: 1
  workers: 4
  max_input_chars: 400

indexing:
  mode: scanner

scanner:
  include:
    - README.md
    - pyproject.toml
    - Dockerfile
    - docker-compose*.yml
    - src/*.py
    - src/**/*.py
    - evals/*.yaml
    - scripts/*.py
    - frontend/package.json
  exclude:
    - .claude/**
    - .codex/**
    - .opencode/**
    - frontend/node_modules/**
    - generated/**
    - htmlcov/**
    - logs/**
    - workspaces/**
    - src/app/**
    - src/templates/**
    - src/tests/**
    - src/themes/**
    - test_generated/**
    - test_codex_cli/**
    - "*.db"
    - "*.history*"
    - "*.png"
    - ".env*"
  max_file_bytes: 500000
  chunk_lines: 180
  symbol_chunks: true

search:
  limit: 10
  preview_lines: 10
  strategy: vector

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

graph:
  enabled: true
  artifact: .code-diver/protogen-ollama-qdrant-graph.json
  ast_enabled: true
  expansion_depth: 1
  neighbor_limit: 20

pi:
  binary: npx
  launcher_args:
    - -y
    - "@earendil-works/pi-coding-agent"
  extension: .pi/extensions/code-diver-rag.ts
  prompt_template: .pi/prompts/code-diver-rag.md
  provider: google
  model: google/gemini-3.5-flash
  fallback_models:
    - google/gemini-3-flash-preview
    - google/gemini-2.5-flash
  timeout_seconds: 90
  tools:
    - code_diver_index
    - code_diver_index_selected
    - code_diver_search
    - code_diver_inspect
    - code_diver_open
    - code_diver_evaluate
    - code_diver_experiment
    - code_diver_tree
    - code_diver_grep
    - code_diver_rg
    - code_diver_read
    - code_diver_symbols
  toolsets:
    indexing:
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
      - code_diver_inspect
      - code_diver_index_selected
      - code_diver_evaluate
    vector_search:
      - code_diver_search
      - code_diver_inspect
      - code_diver_open
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
      - code_diver_evaluate
    grep_search:
      - code_diver_inspect
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
  extra_args: []

trace:
  enabled: true
  artifact: .code-diver/traces/protogen-ollama-qdrant-indexing.jsonl
  include_prompts: true

evaluation:
  dataset: datasets/protogen_eval_100.jsonl
  limit: 10

experiments:
  suite: protogen-ollama-qdrant
  strategies:
    - vector
    - recursive
    - graph
  hypotheses:
    - name: vector_qdrant
      strategy: vector
      toolset: vector_search
      description: Qdrant vector retrieval with mxbai embeddings.
    - name: recursive_qdrant
      strategy: recursive
      toolset: vector_search
      description: Multi-round Qdrant vector retrieval.
    - name: graph_ast_qdrant
      strategy: graph
      toolset: vector_search
      description: AST GraphRAG expansion over Qdrant results.
    - name: ai_grep_only
      toolset: grep_search
      description: Pi agent searches through grep, rg, tree, symbols, and read without vector search.
    - name: ai_selected_index
      toolset: indexing
      description: Pi agent inspects the repository and saves selected file ranges into Qdrant.
    - name: ai_index_tree_only
      tools:
        - code_diver_tree
        - code_diver_index_selected
      description: Pi agent indexes with only tree discovery plus selected persistence.
    - name: ai_index_symbols_only
      tools:
        - code_diver_symbols
        - code_diver_index_selected
      description: Pi agent indexes with only symbol listing plus selected persistence.
    - name: ai_index_grep_only
      tools:
        - code_diver_grep
        - code_diver_index_selected
      description: Pi agent indexes with only literal grep plus selected persistence.
    - name: ai_index_rg_only
      tools:
        - code_diver_rg
        - code_diver_index_selected
      description: Pi agent indexes with only regex search plus selected persistence.
    - name: ai_index_read_only
      tools:
        - code_diver_read
        - code_diver_index_selected
      description: Pi agent indexes with only bounded reads plus selected persistence.
    - name: ai_index_inspect_only
      tools:
        - code_diver_inspect
        - code_diver_index_selected
      description: Pi agent indexes with only the concurrent inspect tool plus selected persistence.

metrics:
  enabled: false

plugins: []
