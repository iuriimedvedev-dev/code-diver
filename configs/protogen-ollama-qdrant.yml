root: ../protogen
artifact: .code-diver/protogen-ollama-qdrant-index.json

storage:
  provider: qdrant
  qdrant:
    location: .code-diver/qdrant-ollama-v2
    collection: protogen_ollama_embeddings
    batch_size: 256

embedding:
  provider: openai_compatible
  model: mxbai-embed-large
  dimensions:
  url: http://127.0.0.1:11434/v1/embeddings
  api_key: ollama
  batch_size: 1
  workers: 4
  max_input_chars: 400

indexing:
  mode: scanner

scanner:
  include:
    - README.md
    - pyproject.toml
    - Dockerfile
    - docker-compose*.yml
    - src/*.py
    - src/**/*.py
    - evals/*.yaml
    - scripts/*.py
    - frontend/package.json
  exclude:
    - .claude/**
    - .codex/**
    - .opencode/**
    - frontend/node_modules/**
    - generated/**
    - htmlcov/**
    - logs/**
    - workspaces/**
    - src/app/**
    - src/templates/**
    - src/tests/**
    - src/themes/**
    - test_generated/**
    - test_codex_cli/**
    - "*.db"
    - "*.history*"
    - "*.png"
    - ".env*"
  max_file_bytes: 500000
  chunk_lines: 180
  symbol_chunks: true

search:
  limit: 10
  preview_lines: 10
  strategy: vector

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

hybrid_search:
  candidate_limit: 80
  lexical_candidate_limit: 80
  vector_weight: 0.6
  lexical_weight: 0.18
  path_weight: 0.12
  symbol_weight: 0.05
  graph_weight: 0.05
  graph_depth: 1
  graph_neighbor_limit: 20
  min_token_length: 3

graph:
  enabled: true
  artifact: .code-diver/protogen-ollama-qdrant-graph.json
  ast_enabled: true
  reference_edges_enabled: false
  call_edges_enabled: false
  expansion_depth: 1
  neighbor_limit: 20

pi:
  binary: npx
  launcher_args:
    - -y
    - "@earendil-works/pi-coding-agent"
  extension: .pi/extensions/code-diver-rag.ts
  prompt_template: .pi/prompts/code-diver-rag.md
  provider: google
  model: google/gemini-3.5-flash
  fallback_models:
    - google/gemini-3-flash-preview
    - google/gemini-2.5-flash
  timeout_seconds: 90
  tools:
    - code_diver_index
    - code_diver_index_selected
    - code_diver_search
    - code_diver_inspect
    - code_diver_open
    - code_diver_evaluate
    - code_diver_experiment
    - code_diver_tree
    - code_diver_grep
    - code_diver_rg
    - code_diver_read
    - code_diver_symbols
  toolsets:
    indexing:
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
      - code_diver_inspect
      - code_diver_index_selected
      - code_diver_evaluate
    vector_search:
      - code_diver_search
      - code_diver_inspect
      - code_diver_open
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
      - code_diver_evaluate
    grep_search:
      - code_diver_inspect
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
  extra_args: []

trace:
  enabled: true
  artifact: .code-diver/traces/protogen-ollama-qdrant-indexing.jsonl
  include_prompts: true

evaluation:
  dataset: datasets/protogen_eval_100.jsonl
  limit: 10

experiments:
  suite: protogen-ollama-qdrant
  strategies:
    - vector
    - recursive
    - graph
    - hybrid
  hypotheses:
    - name: vector_qdrant
      strategy: vector
      toolset: vector_search
      description: Qdrant vector retrieval with mxbai embeddings.
    - name: recursive_qdrant
      strategy: recursive
      toolset: vector_search
      description: Multi-round Qdrant vector retrieval.
    - name: graph_ast_qdrant
      strategy: graph
      toolset: vector_search
      description: AST GraphRAG expansion over Qdrant results.
    - name: hybrid_candidates_no_llm
      strategy: hybrid
      description: Deterministic vector, lexical, path, symbol, and graph candidate fusion without LLM turns.
    - name: hybrid_candidates_lexical
      strategy: hybrid
      hybrid_search:
        candidate_limit: 80
        lexical_candidate_limit: 120
        vector_weight: 0.35
        lexical_weight: 0.35
        path_weight: 0.2
        symbol_weight: 0.05
        graph_weight: 0.05
        graph_depth: 1
        graph_neighbor_limit: 20
        min_token_length: 3
      description: Deterministic fusion with stronger lexical and path signals.
    - name: hybrid_candidates_graph_boost
      strategy: hybrid
      hybrid_search:
        candidate_limit: 80
        lexical_candidate_limit: 80
        vector_weight: 0.5
        lexical_weight: 0.15
        path_weight: 0.1
        symbol_weight: 0.05
        graph_weight: 0.2
        graph_depth: 2
        graph_neighbor_limit: 30
        min_token_length: 3
      description: Deterministic fusion with stronger AST/import/call graph propagation.
    - name: hybrid_candidates_bm25_rrf
      strategy: hybrid
      hybrid_search:
        candidate_limit: 80
        lexical_candidate_limit: 120
        vector_weight: 0.55
        lexical_weight: 0.25
        path_weight: 0.1
        symbol_weight: 0.05
        graph_weight: 0.05
        graph_depth: 1
        graph_neighbor_limit: 20
        lexical_scoring: bm25
        fusion: rrf
        rrf_k: 60
        bm25_k1: 1.2
        bm25_b: 0.75
        min_token_length: 3
      description: Deterministic BM25 lexical scoring with reciprocal rank fusion over vector, lexical, path, symbol, and graph signals.
    - name: hybrid_candidates_bm25_weighted
      strategy: hybrid
      hybrid_search:
        candidate_limit: 80
        lexical_candidate_limit: 120
        vector_weight: 0.6
        lexical_weight: 0.18
        path_weight: 0.12
        symbol_weight: 0.05
        graph_weight: 0.05
        graph_depth: 1
        graph_neighbor_limit: 20
        lexical_scoring: bm25
        fusion: weighted
        bm25_k1: 1.2
        bm25_b: 0.75
        min_token_length: 3
      description: BM25 lexical scoring with the existing weighted fusion baseline.
    - name: hybrid_candidates_bm25_rrf_vector
      strategy: hybrid
      hybrid_search:
        candidate_limit: 80
        lexical_candidate_limit: 120
        vector_weight: 0.78
        lexical_weight: 0.1
        path_weight: 0.06
        symbol_weight: 0.03
        graph_weight: 0.03
        graph_depth: 1
        graph_neighbor_limit: 20
        lexical_scoring: bm25
        fusion: rrf
        rrf_k: 80
        bm25_k1: 1.2
        bm25_b: 0.75
        min_token_length: 3
      description: BM25/RRF profile biased toward vector rank to protect hit@1 and MRR.
    - name: hybrid_candidates_routed
      strategy: hybrid
      hybrid_search:
        candidate_limit: 80
        lexical_candidate_limit: 120
        vector_weight: 0.6
        lexical_weight: 0.18
        path_weight: 0.12
        symbol_weight: 0.05
        graph_weight: 0.05
        graph_depth: 1
        graph_neighbor_limit: 20
        routing_enabled: true
        min_token_length: 3
      description: Deterministic router selects stronger lexical/path/symbol or graph weighting by query shape.
    - name: hybrid_candidates_path_symbol
      strategy: hybrid
      hybrid_search:
        candidate_limit: 80
        lexical_candidate_limit: 120
        vector_weight: 0.45
        lexical_weight: 0.2
        path_weight: 0.25
        symbol_weight: 0.1
        graph_weight: 0.0
        graph_depth: 0
        graph_neighbor_limit: 0
        min_token_length: 3
      description: Deterministic fusion emphasizing file paths and symbol metadata.
    - name: ai_grep_only
      toolset: grep_search
      description: Direct orchestrator searches through grep, rg, tree, symbols, and read without vector search.
    - name: ai_search_vector_only
      tools:
        - code_diver_search
      description: Direct orchestrator searches only through the existing vector index.
    - name: ai_search_rg_only
      tools:
        - code_diver_rg
      description: Direct orchestrator searches only through structured regex matches.
    - name: ai_search_grep_only
      tools:
        - code_diver_grep
      description: Direct orchestrator searches only through structured literal grep matches.
    - name: ai_search_symbols_only
      tools:
        - code_diver_symbols
      description: Direct orchestrator searches only through structured symbol discovery.
    - name: ai_search_tree_only
      tools:
        - code_diver_tree
      description: Direct orchestrator searches only through gitignore-aware tree discovery.
    - name: ai_search_inspect_only
      tools:
        - code_diver_inspect
      description: Direct orchestrator searches only through the concurrent inspect summary tool.
    - name: ai_search_rg_read
      tools:
        - code_diver_rg
        - code_diver_read
      description: Direct orchestrator finds candidates with rg and reads selected source ranges.
    - name: ai_search_vector_read
      tools:
        - code_diver_search
        - code_diver_read
      description: Direct orchestrator finds candidates with vector search and reads selected source ranges.
    - name: ai_search_vector_rg
      tools:
        - code_diver_search
        - code_diver_rg
      description: Direct orchestrator combines vector candidates with explicit regex probes, without source reads.
    - name: ai_search_vector_symbols
      tools:
        - code_diver_search
        - code_diver_symbols
      description: Direct orchestrator combines vector candidates with symbol discovery.
    - name: ai_search_vector_inspect
      tools:
        - code_diver_search
        - code_diver_inspect
      description: Direct orchestrator combines vector candidates with the structured inspect tool.
    - name: ai_search_vector_rg_read
      tools:
        - code_diver_search
        - code_diver_rg
        - code_diver_read
      description: Direct orchestrator combines vector candidates, explicit regex probes, and bounded reads.
    - name: ai_search_vector_symbols_read
      tools:
        - code_diver_search
        - code_diver_symbols
        - code_diver_read
      description: Direct orchestrator combines vector candidates, symbols, and bounded reads.
    - name: ai_selected_index
      toolset: indexing
      description: Direct orchestrator inspects the repository and saves selected file ranges into Qdrant.
    - name: ai_index_tree_only
      tools:
        - code_diver_tree
        - code_diver_index_selected
      description: Direct orchestrator indexes with only tree discovery plus selected persistence.
    - name: ai_index_symbols_only
      tools:
        - code_diver_symbols
        - code_diver_index_selected
      description: Direct orchestrator indexes with only symbol listing plus selected persistence.
    - name: ai_index_grep_only
      tools:
        - code_diver_grep
        - code_diver_index_selected
      description: Direct orchestrator indexes with only literal grep plus selected persistence.
    - name: ai_index_rg_only
      tools:
        - code_diver_rg
        - code_diver_index_selected
      description: Direct orchestrator indexes with only regex search plus selected persistence.
    - name: ai_index_read_only
      tools:
        - code_diver_read
        - code_diver_index_selected
      description: Direct orchestrator indexes with only bounded reads plus selected persistence.
    - name: ai_index_inspect_only
      tools:
        - code_diver_inspect
        - code_diver_index_selected
      description: Direct orchestrator indexes with only the concurrent inspect tool plus selected persistence.

metrics:
  enabled: false

plugins: []
