base_config: configs/codesearchnet-mteb-python-h5-qwen-quality.yml
output: .code-diver/reports/codesearchnet-local-gemma-ranker-slice.json
log_dir: .code-diver/logs/generation-models
reindex: false
port: 8012
startup_timeout_seconds: 1200
timeout_ms: 180000
memory_fraction: 0.72
config_overrides:
  evaluation:
    dataset: .code-diver/tmp/codesearchnet_python_100.jsonl
    limit: 10
    workers: 1
  trace:
    include_prompts: true
embedding:
  name: qwen3_embedding_0_6b_mlx_4bit
  provider: openai_compatible
  model: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  dimensions:
  url: http://127.0.0.1:8001/v1/embeddings
  api_key: local
  batch_size: 128
  workers: 1
  max_input_chars: 900
  cost_per_1m_tokens_usd: 0
hypotheses:
  - h5_qwen_index_gemini_flash_lite_top10
search_config_overrides:
  llm_rerank:
    candidate_limit: 30
    rerank_limit: 10
    max_preview_chars: 700
    mode: precision
    include_reasons: false
    preserve_top_candidate: false
generation_models:
  - name: gemma4_e2b_it_4bit
    runtime: mlx_vlm
    model: mlx-community/gemma-4-e2b-it-4bit
    precision: 4bit
    quantization: uniform-4bit
    port: 8012
    max_tokens: 512
  - name: gemma4_e4b_it_4bit
    runtime: mlx_vlm
    model: mlx-community/gemma-4-e4b-it-4bit
    precision: 4bit
    quantization: uniform-4bit
    port: 8012
    max_tokens: 512
  - name: gemma4_e4b_it_optiq_4bit
    runtime: mlx_lm
    model: mlx-community/gemma-4-e4b-it-OptiQ-4bit
    precision: 4bit
    quantization: optiq-4bit
    port: 8012
    max_tokens: 512
    prompt_concurrency: 1
    decode_concurrency: 1
    chat_template_args: '{"enable_thinking": false}'
