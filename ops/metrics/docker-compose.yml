services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:latest}
    container_name: code-diver-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-code_diver}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-code_diver}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-code_diver}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d/resources.xml:/etc/clickhouse-server/users.d/code-diver-resources.xml:ro
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-1g}
    cpus: ${CLICKHOUSE_CPUS:-1.0}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: code-diver-grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/code-diver-rag-evals.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    cpus: ${GRAFANA_CPUS:-0.5}

volumes:
  clickhouse-data:
  grafana-data:
