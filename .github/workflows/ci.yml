name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format, Clippy and tests (native CLI; no Python)
        shell: bash
        run: |
          set -euo pipefail
          manifest="native/code_diver_search_bin/Cargo.toml"
          cargo fmt --manifest-path "$manifest" --all -- --check
          cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --locked --manifest-path "$manifest" --all-targets
      - name: Mock acceptance (no cluster)
        run: bash scripts/tests/acceptance_test.sh
