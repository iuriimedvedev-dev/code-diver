name: code-diver-local

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: ${LOG_MAX_FILES:-3}

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: ${QDRANT_CONTAINER_NAME:-code-diver-local-qdrant}
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ${QDRANT_STORAGE_PATH:-./.code-diver/docker/qdrant}:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: ${QDRANT_MAX_SEARCH_THREADS:-0}
      QDRANT__STORAGE__OPTIMIZERS__MAX_OPTIMIZATION_THREADS: ${QDRANT_MAX_OPTIMIZATION_THREADS:-2}
    mem_limit: ${QDRANT_MEM_LIMIT:-8g}
    cpus: ${QDRANT_CPUS:-6.0}
    logging: *common-logging

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:latest}
    container_name: ${CLICKHOUSE_CONTAINER_NAME:-code-diver-local-clickhouse}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-code_diver}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-code_diver}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-code_diver}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - ${CLICKHOUSE_STORAGE_PATH:-./.code-diver/docker/clickhouse}:/var/lib/clickhouse
      - ./ops/metrics/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./ops/metrics/clickhouse/users.d/resources.xml:/etc/clickhouse-server/users.d/code-diver-resources.xml:ro
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-4g}
    cpus: ${CLICKHOUSE_CPUS:-4.0}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *common-logging

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: ${GRAFANA_CONTAINER_NAME:-code-diver-local-grafana}
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/code-diver-rag-evals.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ${GRAFANA_STORAGE_PATH:-./.code-diver/docker/grafana}:/var/lib/grafana
      - ./ops/metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/metrics/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: ${GRAFANA_MEM_LIMIT:-1g}
    cpus: ${GRAFANA_CPUS:-1.0}
    logging: *common-logging

  code-diver:
    build:
      context: .
      dockerfile: Dockerfile
    image: code-diver:local
    profiles:
      - tools
    depends_on:
      qdrant:
        condition: service_started
      clickhouse:
        condition: service_healthy
    working_dir: /app
    environment:
      CODE_DIVER_CONFIG: ${CODE_DIVER_CONFIG:-/app/configs/container.yml}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ${CODEBASE_PATH:-.}:/workspace:ro
      - ${ARTIFACTS_PATH:-./.code-diver/container}:/artifacts
      - ./configs:/app/configs:ro
      - ./datasets:/app/datasets:ro
    logging: *common-logging
