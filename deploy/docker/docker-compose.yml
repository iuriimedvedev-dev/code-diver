version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: code-diver-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  code-diver-search:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: code-diver-search
    restart: unless-stopped
    environment:
      - CODE_DIVER_STORAGE_PROVIDER=qdrant
      - CODE_DIVER_STORAGE_URL=http://qdrant:6333
      - CODE_DIVER_EMBEDDING_PROVIDER=openai_compatible
      - CODE_DIVER_EMBEDDING_URL=http://host.docker.internal:8000/v1
    volumes:
      - ./code-diver.yml:/app/code-diver.yml:ro
      - ../..:/app/repo:ro
    depends_on:
      - qdrant
    ports:
      - "8080:8080"

volumes:
  qdrant_storage:
