# PLACEHOLDERS ONLY -- do not commit real secrets and do not `kubectl apply`
# this file as-is. Create the real objects out-of-band.
#
# Profiles:
#   LOCAL overlay  -- needs NO Secret at all (OAuth off, no Ingress).
#   WORK overlay   -- needs code-diver-oauth (JWT + consent) and the TLS
#                     secret, unless cert-manager provides the latter.
#   PROJECT overlay-- its own code-diver-oauth in its own namespace; never
#                     reuse another project's JWT/consent secret.
#
#   kubectl -n code-diver create secret generic code-diver-oauth \
#     --from-literal=jwt-secret="$(openssl rand -hex 32)" \
#     --from-literal=consent-secret="$(openssl rand -hex 16)"
#
#   kubectl -n code-diver create secret generic code-diver-qdrant \
#     --from-literal=api-key='...'
#
#   kubectl -n code-diver create secret tls code-diver-tls \
#     --cert=fullchain.pem --key=privkey.pem
#
# CODE_DIVER_OAUTH_JWT_SECRET_FILE points at the mounted `jwt-secret` key;
# the file must contain >= 32 characters. Deleting the OAuth SQLite DB
# (/data/oauth/oauth.sqlite3 on the state PVC) revokes every client at once.
apiVersion: v1
kind: Secret
metadata:
  name: code-diver-oauth
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/component: mcp-server
type: Opaque
stringData:
  # HS256 signing secret, >= 32 chars (mounted as a file).
  jwt-secret: "REPLACE_ME_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
  # Operator code that gates the /authorize consent form.
  consent-secret: "REPLACE_ME_OPERATOR_CONSENT_CODE"
---
# Optional: only needed when the external Qdrant requires an API key.
apiVersion: v1
kind: Secret
metadata:
  name: code-diver-qdrant
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/component: qdrant-client
type: Opaque
stringData:
  api-key: "REPLACE_ME_QDRANT_API_KEY"
---
# Optional: only needed for the first-run catalog restore Job.
apiVersion: v1
kind: Secret
metadata:
  name: code-diver-restore
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/component: restore-job
type: Opaque
stringData:
  # HTTPS URL of a tar.gz containing index.json / graph.json (relative to the
  # /data/catalog directory).
  catalog-url: "https://artifacts.example.com/code-diver/catalog.tar.gz"
  catalog-sha256: ""
---
# TLS certificate for the Ingress. cert-manager creates an equivalent
# kubernetes.io/tls secret automatically -- use ONE of the two, not both.
apiVersion: v1
kind: Secret
metadata:
  name: code-diver-tls
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/component: ingress
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----REPLACE-WITH-REAL-CERTIFICATE-CHAIN-----
  tls.key: |
    -----REPLACE-WITH-REAL-PRIVATE-KEY-----
---
# OPTIONAL: app-terminated TLS (component app-tls, overlay topology W2).
# Only used when the pod itself must serve HTTPS (NodePort/LoadBalancer,
# WireGuard, or ingress ssl-passthrough):
#   kubectl -n code-diver create secret tls code-diver-mcp-tls \
#     --cert=fullchain.pem --key=privkey.pem
apiVersion: v1
kind: Secret
metadata:
  name: code-diver-mcp-tls
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/component: app-tls
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----REPLACE-WITH-REAL-CERTIFICATE-CHAIN-----
  tls.key: |
    -----REPLACE-WITH-REAL-PRIVATE-KEY-----
