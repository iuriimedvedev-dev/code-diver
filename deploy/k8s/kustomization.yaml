apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default profile = work (OAuth on, Ingress + TLS).
#   kubectl apply -k deploy/k8s
# is therefore the production-safe profile.
#
# Home / no-auth / no-ingress:   kubectl apply -k deploy/k8s/overlays/local
#
# Before the first work apply, set the four knobs documented in README.md:
# issuer host, TLS variant, storage class, registry.
resources:
  - overlays/work
