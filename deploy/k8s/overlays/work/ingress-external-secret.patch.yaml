# Knob 2, TLS variant B (INACTIVE): use a certificate you already have.
#
# Switch to B by editing kustomization.yaml:
#   comment out  - path: ingress-cert-manager.patch.yaml
#   uncomment    - path: ingress-external-secret.patch.yaml
#
# Then create the secret BEFORE applying (name set by the JSON6902 patch in
# kustomization.yaml):
#   kubectl -n code-diver create secret tls code-diver-tls \
#     --cert=fullchain.pem --key=privkey.pem
#
# `null` deletes the annotation in a strategic merge patch, so cert-manager
# never tries to overwrite a manually managed secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-diver
  annotations:
    cert-manager.io/cluster-issuer: null
