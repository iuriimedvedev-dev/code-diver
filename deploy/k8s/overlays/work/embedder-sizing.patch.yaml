# Embedder sizing for the WORK profile. Only valid together with
# `components/embedder` (uncomment it in kustomization.yaml).
#
# `-np 8 -t 6` targets up to ~8 simultaneous searches across all projects that
# share this endpoint, on a node with 8 cores available to the pod. Rule of
# thumb: slots >= expected simultaneous searches, threads <= CPU limit.
# See README, "Embedder sizing".
apiVersion: v1
kind: ConfigMap
metadata:
  name: embedder-config
data:
  EMBED_SLOTS: "8"
  EMBED_THREADS: "6"
  EMBED_CTX: "2048"
  EMBED_BATCH: "512"
  EMBED_UBATCH: "512"
