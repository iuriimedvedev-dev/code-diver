# OPTIONAL (inactive): reach the unauthenticated local endpoint from a home
# LAN or a WireGuard/tailnet address without port-forwarding.
#
# A NodePort is cluster-wide; only do this on a single-user / trusted cluster.
apiVersion: v1
kind: Service
metadata:
  name: code-diver-service
spec:
  type: NodePort
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
      protocol: TCP
      nodePort: 30080
