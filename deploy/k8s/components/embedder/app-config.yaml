# App config used ONLY when the embedder component is enabled. Same as
# base/configmap.yaml except `embedding.url` points at the in-cluster Service.
# Keep the rest in sync with base/configmap.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-diver-embedder-config
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/component: embedder
    app.kubernetes.io/part-of: code-diver
data:
  code-diver-embedder.yml: |
    root: /workspace
    artifact: /data/catalog/index.json

    storage:
      provider: qdrant
      qdrant:
        url: http://qdrant.qdrant.svc.cluster.local:6333
        collection: code_diver
        api_key_env: QDRANT_API_KEY
        batch_size: 128

    embedding:
      provider: openai_compatible
      # Must match EMBED_MODEL_ALIAS in embedder-config.
      model: google/embeddinggemma-300m
      dimensions: 768
      # In-cluster Service `embedder` (same namespace), llama-server.
      url: http://embedder:8791/v1/embeddings
      api_key: local
      batch_size: 96
      workers: 4
      max_input_chars: 1200
      max_input_tokens: 512
      token_safety_margin: 32
      query_prefix: "task: code retrieval | query: "
      document_prefix: "title: none | text: "

    indexing:
      mode: scanner

    scanner:
      include: []
      exclude:
        - .git/**
        - .env*
        - node_modules/**
        - .venv/**
        - dist/**
        - build/**
        - target/**
        - .code-diver/**
        - "*.png"
        - "*.jpg"
        - "*.jpeg"
        - "*.gif"
        - "*.webp"
        - "*.db"
      max_file_bytes: 1000000

    search:
      limit: 10
      preview_lines: 8
      strategy: hybrid

    graph:
      enabled: true
      artifact: /data/catalog/graph.json
      ast_enabled: false
      reference_edges_enabled: true
      expansion_depth: 1
      neighbor_limit: 20

    trace:
      enabled: true
      artifact: /data/catalog/traces/indexing.jsonl
      include_prompts: false

    ui:
      color: false
      pager: never
      links: false
