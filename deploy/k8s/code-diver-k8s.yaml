# DEPRECATED BUT SUPPORTED single-file mirror of the kustomize base.
#
# The canonical manifests are now:
#   base/                      shared resources (OAuth OFF, no Ingress)
#   overlays/local/            home: no OAuth, no Ingress, local-path storage
#   overlays/work/             enterprise: OAuth, Ingress, TLS, fast-ssd
#   overlays/project-example/  a second project
#
# Keep using this file only for a self-contained `kubectl apply -f` on a
# trusted, unauthenticated cluster. It contains exactly the base resources
# plus the optional Qdrant StatefulSet, and NO Ingress/OAuth. For anything
# reachable from a network you do not fully trust, use overlays/work.
#
# Generated by concatenating the files above; edit those, then re-run the
# concatenation (see README.md, "Legacy single file").

---
# ---- base/namespace.yaml ----
apiVersion: v1
kind: Namespace
metadata:
  name: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted

---
# ---- base/configmap.yaml ----
# Two ConfigMaps on purpose:
#
#   code-diver-config : the YAML file the CLI loads (mounted as a file).
#   code-diver-env    : environment variables (OAuth, sessions, CORS).
#
# They cannot be one object: `envFrom` would also turn the `code-diver.yml`
# key into an invalid environment variable name.
#
# Placeholders that MUST be replaced:
#   * storage.qdrant.url / collection
#   * embedding.model / dimensions / url
#   * CODE_DIVER_OAUTH_ISSUER (must equal the public URL clients use)
#
# Per-project deployments: copy overlays/project-example, give each project a
# DISTINCT qdrant collection and its own PVCs/namespace. Two projects must
# never share one collection.
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-diver-config
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/component: mcp-server
data:
  code-diver.yml: |
    # Repository content comes from the repo PVC mounted at /workspace.
    root: /workspace
    # Local catalog metadata. With storage.provider=qdrant this file is not
    # the vector store, but graph/trace indexes live beside it.
    artifact: /data/catalog/index.json

    storage:
      provider: qdrant
      qdrant:
        # EXTERNAL Qdrant. Point this at an existing instance, or apply the
        # optional qdrant-statefulset.yaml in this directory.
        url: http://qdrant.qdrant.svc.cluster.local:6333
        # One collection per project. Never share it between projects.
        collection: code_diver
        api_key_env: QDRANT_API_KEY
        batch_size: 128

    embedding:
      provider: openai_compatible
      # MUST match the model that built the collection (dimension mismatch
      # fails at query time, not at startup).
      model: REPLACE_ME-embedding-model
      dimensions: 768
      url: http://embedding.embedding.svc.cluster.local:8000/v1/embeddings
      api_key: local
      batch_size: 96
      workers: 4
      max_input_chars: 1200
      max_input_tokens: 512
      token_safety_margin: 32
      query_prefix: "task: code retrieval | query: "
      document_prefix: "title: none | text: "

    indexing:
      mode: scanner

    scanner:
      include: []
      exclude:
        - .git/**
        - .env*
        - node_modules/**
        - .venv/**
        - dist/**
        - build/**
        - target/**
        - .code-diver/**
        - "*.png"
        - "*.jpg"
        - "*.jpeg"
        - "*.gif"
        - "*.webp"
        - "*.db"
      max_file_bytes: 1000000

    search:
      limit: 10
      preview_lines: 8
      # "hybrid" needs the embedder + Qdrant only. Switch to
      # "graph_file_cross_encoder" after pointing cross_encoder_rerank.url at
      # an external rerank daemon (see README, "External dependencies").
      strategy: hybrid

    graph:
      enabled: true
      artifact: /data/catalog/graph.json
      ast_enabled: false
      reference_edges_enabled: true
      expansion_depth: 1
      neighbor_limit: 20

    trace:
      enabled: true
      artifact: /data/catalog/traces/indexing.jsonl
      include_prompts: false

    ui:
      color: false
      pager: never
      links: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-diver-env
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/component: mcp-server
data:
  # ---------------------------------------------------------------------
  # OAuth 2.1. BASE DEFAULT: DISABLED (local/home profile). The work overlay
  # flips it to "1" and replaces the issuer/resource with the public host.
  # Never expose the Service outside the cluster while it is disabled.
  # ---------------------------------------------------------------------
  CODE_DIVER_OAUTH_ENABLED: "0"
  # Byte-identical to the URL clients use, https, no trailing slash.
  CODE_DIVER_OAUTH_ISSUER: "https://code-diver.example.com"
  CODE_DIVER_OAUTH_RESOURCE: "https://code-diver.example.com/mcp"
  CODE_DIVER_OAUTH_ACCESS_TTL: "900"
  CODE_DIVER_OAUTH_REFRESH_TTL: "2592000"
  CODE_DIVER_OAUTH_CODE_TTL: "60"
  CODE_DIVER_OAUTH_DB: "/data/oauth/oauth.sqlite3"
  # Protect /api/* with the same scopes; the ingress does not publish /api by
  # default, but the Service still exposes it in-cluster.
  CODE_DIVER_OAUTH_PROTECT_REST: "1"
  CODE_DIVER_OAUTH_MAX_CLIENTS: "500"
  # Non-browser MCP clients send no Origin; set the exact browser origin in
  # the work overlay. "*" is acceptable only for the unauthenticated local
  # profile on a trusted network.
  CODE_DIVER_CORS_ORIGINS: "*"

  # ---------------------------------------------------------------------
  # Streamable HTTP sessions / limits
  # ---------------------------------------------------------------------
  CODE_DIVER_MCP_MAX_SESSIONS: "256"
  CODE_DIVER_MCP_SESSION_IDLE: "1800"
  CODE_DIVER_MCP_SSE_PING: "15"
  CODE_DIVER_MCP_MAX_BODY: "4194304"
  CODE_DIVER_INGEST_MAX_FILES: "500"
  CODE_DIVER_INDEX_TIMEOUT: "3600"

  # uvicorn trusts X-Forwarded-* only from these peers. ingress-nginx is the
  # only ingress; narrow this to the controller's pod CIDR where possible.
  FORWARDED_ALLOW_IPS: "*"

  # No dedicated log-level switch exists in code-diver (uvicorn runs at
  # info). PYTHONUNBUFFERED keeps container logs line-buffered.
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

---
# ---- base/pvc.yaml ----
# Two volumes, two lifetimes:
#
#   repo-shared-pvc     the checkout code-diver reads and indexes. Refresh it
#                       with CI/git-sync; the engine only needs read access,
#                       except for `code_diver_index_ingest` which writes
#                       <root>/.code_diver_remote_ingest (see README).
#   code-diver-state-pvc catalog/index metadata, graph, traces, OAuth SQLite
#                       and remote-ingest bookkeeping. Size per project.
#
# Both are ReadWriteOnce: the Deployment uses strategy: Recreate, so only one
# pod mounts them at a time. Vectors live in the external Qdrant, not here.
#
# The repo PVC name is kept from the previous manifest (`repo-shared-pvc`) so
# an existing claim is adopted instead of orphaned.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: repo-shared-pvc
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/component: repo
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: REPLACE_ME_STORAGE_CLASS
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-diver-state-pvc
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/component: catalog
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: REPLACE_ME_STORAGE_CLASS
  resources:
    requests:
      storage: 10Gi

---
# ---- base/deployment.yaml ----
# One Deployment per project.
#
# Why replicas: 1 + strategy: Recreate
#   * the local catalog (index.json + graph.json + traces) is a single-writer
#     directory on a RWO volume, and `code_diver_index_trigger` spawns a child
#     process that writes it;
#   * the OAuth store is SQLite on the state PVC -- two pods would corrupt it;
#   * Recreate guarantees the old pod releases both RWO volumes before the new
#     one starts.
# Vectors live in the external Qdrant, which *can* serve many readers; the
# blocker for replicas > 1 is the local state, not Qdrant. See README.
#
# Why one Deployment per project instead of one with a PROJECT env var:
#   the CLI takes exactly one config file and one `root` per process, and each
#   project needs its own collection, PVC and OAuth issuer. `code-diver serve`
#   creates one SearchRuntime per process, so multi-project in one process is
#   not supported. Use overlays/project-example to stamp another copy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-diver-service
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/instance: code-diver
    app.kubernetes.io/component: mcp-server
    # Kept from the previous single-file manifest so `kubectl apply` adopts
    # the existing object instead of failing on an immutable selector.
    app: code-diver
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: code-diver
  template:
    metadata:
      labels:
        app: code-diver
        app.kubernetes.io/name: code-diver
        app.kubernetes.io/instance: code-diver
        app.kubernetes.io/component: mcp-server
      annotations:
        # Requires stakater/reloader. Without it, apply the ConfigMap and run
        # `kubectl -n code-diver rollout restart deploy/code-diver-service`.
        configmap.reloader.stakater.com/reload: "code-diver-config,code-diver-env"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: code-diver:0.6.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - mkdir -p /data/catalog/traces /data/oauth
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: state
              mountPath: /data
      containers:
        - name: code-diver
          image: code-diver:0.6.5
          imagePullPolicy: IfNotPresent
          # Override the image ENTRYPOINT (tini + entrypoint.sh, which would
          # re-inject `--config`). The console script is installed system-wide
          # by the image build. Global --config MUST precede the subcommand.
          command:
            - code-diver
          args:
            - --config
            - /etc/code-diver/code-diver.yml
            - serve
            - --host
            - 0.0.0.0
            - --http-port
            - "8080"
            # gRPC is not covered by OAuth; keep it disabled.
            - --grpc-port
            - "0"
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: code-diver-env
          env:
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: CODE_DIVER_OAUTH_JWT_SECRET_FILE
              value: /etc/code-diver/oauth/jwt-secret
            # Operator code for the /authorize consent form. Optional so the
            # local profile (OAuth disabled) starts without any Secret; when
            # OAuth is enabled a missing value makes the server fail closed.
            - name: CODE_DIVER_OAUTH_CONSENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: code-diver-oauth
                  key: consent-secret
                  optional: true
            # Optional: only when the external Qdrant requires auth.
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: code-diver-qdrant
                  key: api-key
                  optional: true
          # /health is public and does not load the SearchRuntime, so it is a
          # process-liveness probe, not an index-readiness probe. The first
          # tool call pays the lazy runtime init.
          startupProbe:
            httpGet:
              path: /health
              port: mcp
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30 # 60 s for a slow image pull / import
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          lifecycle:
            preStop:
              # Let the ingress/Service drop this endpoint before uvicorn
              # closes listeners and in-flight SSE streams are cut.
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          resources:
            # Embedding and reranking are external; this pod is CPU-only:
            # BM25 + fusion + graph expansion. Scale vertically with repo size
            # and concurrent sessions.
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/code-diver
              readOnly: true
            - name: oauth-secret
              mountPath: /etc/code-diver/oauth
              readOnly: true
            - name: repo
              mountPath: /workspace
              # Writable because code_diver_index_ingest writes
              # /workspace/.code_diver_remote_ingest. Mount readOnly: true and
              # never grant code:write if the repo volume is shared read-only.
            - name: state
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: code-diver-config
        - name: oauth-secret
          secret:
            secretName: code-diver-oauth
            # Optional so the local profile needs no Secret. When OAuth is
            # enabled and the Secret is missing, the server exits on startup
            # (the JWT secret is a hard requirement) -- fail closed.
            optional: true
            defaultMode: 0440
            items:
              - key: jwt-secret
                path: jwt-secret
        - name: repo
          persistentVolumeClaim:
            claimName: repo-shared-pvc
        - name: state
          persistentVolumeClaim:
            claimName: code-diver-state-pvc
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi

---
# ---- base/service.yaml ----
apiVersion: v1
kind: Service
metadata:
  name: code-diver-service
  namespace: code-diver
  labels:
    app.kubernetes.io/name: code-diver
    app.kubernetes.io/instance: code-diver
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    # Kept from the previous manifest (immutable on the Deployment).
    app: code-diver
  ports:
    # Single port serves Streamable HTTP MCP (/mcp), the legacy aliases
    # (/mcp/rpc, /), REST (/api/v1/*), ACP and all OAuth endpoints.
    - name: mcp
      port: 8080
      targetPort: mcp
      protocol: TCP

---
# ---- qdrant-statefulset.yaml ----
# OPTIONAL -- only for clusters without an external Qdrant.
#
# The default ConfigMap points at http://qdrant.qdrant.svc.cluster.local:6333,
# i.e. a Qdrant in namespace "qdrant" (shared, external to code-diver). That is
# the recommended topology: several code-diver projects can share one Qdrant
# with distinct collections.
#
# This file is a single-replica StatefulSet with its own PVC and the Service
# name the ConfigMap expects. Use the same file for the hars-longterm-memory
# bundle if both services should share one Qdrant.
#
# The legacy monolithic manifest (deploy/k8s/code-diver-k8s.yaml) still embeds
# its own Qdrant Deployment. Do not apply both in one cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: qdrant
  labels:
    app.kubernetes.io/name: qdrant
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: qdrant
  labels:
    app.kubernetes.io/name: qdrant
spec:
  serviceName: qdrant
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        app.kubernetes.io/name: qdrant
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The upstream image ships UID/GID 1000; the PVC is chowned by fsGroup.
        # If this exact image tag does not start (or cannot write), check the
        # image's own USER and adjust both values -- do not run it as root.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.13.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
              protocol: TCP
            - name: grpc
              containerPort: 6334
              protocol: TCP
          env:
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
            - name: snapshots
              mountPath: /qdrant/snapshots
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: snapshots
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: qdrant
      spec:
        accessModes:
          - ReadWriteOnce
        # storageClassName: REPLACE_ME_STORAGE_CLASS
        resources:
          requests:
            storage: 50Gi
