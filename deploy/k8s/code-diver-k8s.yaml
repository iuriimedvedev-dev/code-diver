apiVersion: v1
kind: Namespace
metadata:
  name: code-diver
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-diver-config
  namespace: code-diver
data:
  code-diver.yml: |
    root: /workspace
    storage:
      provider: qdrant
      url: http://qdrant-service:6333
    embedding:
      provider: openai_compatible
      model: Qwen/Qwen2.5-Coder-0.5B
      url: http://embedding-service:8000/v1
    search:
      strategy: hybrid
      top_k: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: code-diver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.13.4
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: qdrant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: code-diver
spec:
  selector:
    app: qdrant
  ports:
    - protocol: TCP
      port: 6333
      targetPort: 6333
      name: http
    - protocol: TCP
      port: 6334
      targetPort: 6334
      name: grpc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: code-diver
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-diver-service
  namespace: code-diver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: code-diver
  template:
    metadata:
      labels:
        app: code-diver
    spec:
      containers:
        - name: code-diver
          image: ghcr.io/org/code-diver:latest
          command: ["uv", "run", "code-diver", "mcp", "/etc/code-diver/code-diver.yml"]
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/code-diver
              readOnly: true
            - name: repo-volume
              mountPath: /workspace
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: code-diver-config
        - name: repo-volume
          persistentVolumeClaim:
            claimName: repo-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: code-diver-service
  namespace: code-diver
spec:
  type: ClusterIP
  selector:
    app: code-diver
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: mcp-http
