[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "code-diver"
version = "0.1.0"
description = "A small Gemini-backed CLI assistant sandbox for codebase RAG experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "google-genai>=1.0.0",
  "PyYAML>=6.0.2",
  "qdrant-client>=1.15.0",
  "rich>=13.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[project.scripts]
code-diver = "code_diver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_diver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
