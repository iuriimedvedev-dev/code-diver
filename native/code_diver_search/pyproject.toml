[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "code-diver-search"
version = "0.1.0"
description = "Optional native search core for code-diver (PyO3)."
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }

[tool.maturin]
module-name = "code_diver_search"
features = ["python"]
