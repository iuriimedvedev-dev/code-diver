root: .
artifact: .code-diver/index.json

storage:
  provider: qdrant
  qdrant:
    location: .code-diver/qdrant
    collection: code_diver
    api_key_env: QDRANT_API_KEY

embedding:
  provider: gemini
  model: gemini-embedding-2
  dimensions: 768
  batch_size: 32
  workers: 1
  max_input_chars:

generation:
  provider: gemini
  model: gemini-3.5-flash
  fallback_models:
    - gemini-3-flash-preview
    - gemini-2.5-flash
  temperature: 0.1
  thinking_budget: 1024
  api_version: v1alpha
  timeout_ms: 20000

indexing:
  mode: scanner

pi:
  binary: npx
  launcher_args:
    - -y
    - "@earendil-works/pi-coding-agent"
  extension: .pi/extensions/code-diver-rag.ts
  prompt_template: .pi/prompts/code-diver-rag.md
  provider: google
  model: google/gemini-3.5-flash
  fallback_models:
    - google/gemini-3-flash-preview
    - google/gemini-2.5-flash
  timeout_seconds: 180
  tools:
    - code_diver_search
    - code_diver_inspect
    - code_diver_open
    - code_diver_evaluate
    - code_diver_tree
    - code_diver_grep
    - code_diver_rg
    - code_diver_read
    - code_diver_symbols
    - code_diver_rerank
  toolsets:
    vector_search:
      - code_diver_search
      - code_diver_inspect
      - code_diver_open
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
      - code_diver_evaluate
      - code_diver_rerank
    grep_search:
      - code_diver_inspect
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
  extra_args: []

scanner:
  include: []
  exclude: []
  max_file_bytes: 1000000
  chunk_lines: 120
  structural_chunks: true
  symbol_chunks: true
  file_summary_chunks: true

search:
  limit: 10
  preview_lines: 8
  strategy: vector

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

graph:
  enabled: true
  artifact: .code-diver/graph.json
  ast_enabled: true
  expansion_depth: 1
  neighbor_limit: 20

trace:
  enabled: true
  artifact: .code-diver/traces/indexing.jsonl
  include_prompts: true

ui:
  color: true
  pager: auto
  links: true
  editor:
    command: code
    args:
      - -g
      - "{path}:{line}"

evaluation:
  dataset: datasets/sample_eval.jsonl
  limit: 10

experiments:
  suite: code-diver-local
  strategies:
    - vector
    - recursive
    - graph
  hypotheses:
    - name: vector_qdrant
      strategy: vector
      toolset: vector_search
      description: Qdrant vector retrieval with read-only verification tools.
    - name: recursive_qdrant
      strategy: recursive
      toolset: vector_search
      description: Multi-round vector retrieval over Qdrant.
    - name: graph_ast_qdrant
      strategy: graph
      toolset: vector_search
      description: Vector retrieval expanded with AST GraphRAG.
    - name: ai_grep_only
      toolset: grep_search
      description: Pi agent searches with tree, symbols, grep, rg, read, and no vector search.

metrics:
  enabled: false
  url: http://localhost:18123
  database: code_diver
  username: code_diver
  password: code_diver
  docker_container:
  metrics_table: rag_eval_metrics
  cases_table: rag_eval_cases
  timeout_seconds: 10
  retention_days: 30

plugins: []
