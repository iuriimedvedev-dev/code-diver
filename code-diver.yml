root: .
artifact: .code-diver/index.json

storage:
  provider: qdrant
  qdrant:
    url: http://localhost:6333
    collection: code_diver
    api_key_env: QDRANT_API_KEY
    batch_size: 256

embedding:
  provider: openai_compatible
  model: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
  dimensions:
  url: http://127.0.0.1:8001/v1/embeddings
  api_key: local
  batch_size: 128
  workers: 1
  max_input_chars: 400
  query_prefix: "Represent this code search query for retrieving relevant files: "
  document_prefix: "Represent this code file metadata for retrieval: "

generation:
  provider: openai_compatible
  model: mlx-community/Qwen3.5-4B-OptiQ-4bit
  url: http://127.0.0.1:8012/v1/chat/completions
  api_key: local
  fallback_models: []
  temperature: 0
  thinking_budget:
  api_version:
  timeout_ms: 240000
  max_tokens: 2048
  response_format: json_schema
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

indexing:
  mode: scanner

pi:
  binary: npm
  launcher_args:
    - exec
    - --
    - pi
  extension: .pi/extensions/code-diver-rag.ts
  prompt_template: .pi/prompts/code-diver-rag.md
  provider: code-diver-local
  model: mlx-community/Qwen3.5-4B-OptiQ-4bit
  fallback_models: []
  timeout_seconds: 180
  session_dir: .code-diver/pi-sessions
  repo_context:
    enabled: true
    mode: readme_summary
    output: .code-diver/context/repository-context.md
    include_docs: true
    max_chars: 16000
    docs_limit: 8
  env:
    CODE_DIVER_LOCAL_LLM_PROVIDER: code-diver-local
    CODE_DIVER_LOCAL_LLM_MODEL: mlx-community/Qwen3.5-4B-OptiQ-4bit
    CODE_DIVER_LOCAL_LLM_BASE_URL: http://127.0.0.1:8012/v1
    CODE_DIVER_LOCAL_LLM_API_KEY: local
    PI_SKIP_VERSION_CHECK: "1"
    PI_CACHE_RETENTION: long
  tools:
    - code_diver_search
    - code_diver_inspect
    - code_diver_open
    - code_diver_evaluate
    - code_diver_tree
    - code_diver_grep
    - code_diver_rg
    - code_diver_read
    - code_diver_symbols
    - code_diver_rerank
    - code_diver_record_failure
    - code_diver_record_success
  toolsets:
    vector_search:
      - code_diver_search
      - code_diver_inspect
      - code_diver_open
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
      - code_diver_evaluate
      - code_diver_rerank
      - code_diver_record_failure
      - code_diver_record_success
    grep_search:
      - code_diver_inspect
      - code_diver_tree
      - code_diver_symbols
      - code_diver_grep
      - code_diver_rg
      - code_diver_read
      - code_diver_record_failure
      - code_diver_record_success
  extra_args: []

scanner:
  include: []
  exclude: []
  max_file_bytes: 1000000
  line_chunks: false
  chunk_lines: 220
  structural_chunks: false
  symbol_chunks: false
  symbol_body: false
  file_summary_chunks: true
  file_manifest_chunks: true
  max_symbols_per_file: 96

search:
  limit: 10
  preview_lines: 8
  strategy: graph_file_rerank

graph_file_search:
  seed_limit: 120
  lexical_seed_limit: 240
  vector_weight: 0.25
  lexical_weight: 0.25
  path_weight: 0.20
  symbol_weight: 0.10
  graph_weight: 0.45
  depth: 2
  neighbor_limit: 40
  decay: 0.65
  min_token_length: 3

hybrid_search:
  candidate_limit: 280
  lexical_candidate_limit: 900
  vector_weight: 0.42
  lexical_weight: 0.26
  path_weight: 0.12
  symbol_weight: 0.10
  symbol_match_weight: 0.10
  graph_weight: 0.0
  file_vote_weight: 0.06
  graph_depth: 0
  graph_neighbor_limit: 0
  vector_kind_limits:
    file_summary: 170
    file_manifest: 170
  vector_kind_multipliers:
    file_summary: 1.0
    file_manifest: 1.08
  routing_enabled: true
  lexical_scoring: bm25
  fusion: weighted
  preserve_vector_top: true
  vector_top_score_margin: 0.03
  item_kind_weights:
    file_summary: 1.0
    file_manifest: 1.08
  min_token_length: 3

llm_rerank:
  candidate_limit: 30
  rerank_limit: 10
  max_preview_chars: 700
  mode: precision
  include_reasons: false
  preserve_top_candidate: true
  preserve_top_score_margin: 0.1
  retry_attempts: 3
  retry_base_delay_seconds: 1.0
  retry_max_delay_seconds: 8.0

cross_encoder_rerank:
  provider: llama_cpp
  model: Qwen3-Reranker-0.6B
  url: http://127.0.0.1:8081/v1/rerank
  candidate_limit: 34
  max_document_chars: 850
  preserve_top_candidate: true
  preserve_top_score_margin: 0.1
  timeout_ms: 60000

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

graph:
  enabled: true
  artifact: .code-diver/graph.json
  ast_enabled: false
  reference_edges_enabled: true
  call_edges_enabled: false
  expansion_depth: 0
  neighbor_limit: 0

trace:
  enabled: true
  artifact: .code-diver/traces/indexing.jsonl
  include_prompts: true

ui:
  color: true
  pager: auto
  links: true
  editor:
    command: code
    args:
      - -g
      - "{path}:{line}"

evaluation:
  dataset: datasets/sample_eval.jsonl
  limit: 10

experiments:
  suite: code-diver-local
  strategies:
    - hybrid_rerank
  hypotheses:
    - name: h5_default
      strategy: hybrid_rerank
      toolset: vector_search
      description: "H5 baseline: Qwen file-metadata index, hybrid candidates, local LLM top-10 rerank."
    - name: ai_grep_only
      toolset: grep_search
      description: Pi agent searches with tree, symbols, grep, rg, read, and no vector search.

metrics:
  enabled: false
  url: http://localhost:18123
  database: code_diver
  username: code_diver
  password: code_diver
  docker_container:
  metrics_table: rag_eval_metrics
  cases_table: rag_eval_cases
  timeout_seconds: 10
  retention_days: 30

plugins: []
