root: .
artifact: .code-diver/index.json

storage:
  provider: json
  qdrant:
    url: http://localhost:6333
    # For embedded local experiments, use location: .code-diver/qdrant instead of url.
    # For tests, location: ":memory:" works without a Qdrant server.
    collection: code_diver
    api_key_env: QDRANT_API_KEY

embedding:
  provider: gemini
  model: gemini-embedding-2
  dimensions: 768
  batch_size: 32

pi:
  binary: pi
  extension: .pi/extensions/code-diver-rag.ts
  prompt_template: .pi/prompts/code-diver-rag.md
  provider: google
  model: gemini-3.5-flash
  tools:
    - code_diver_index
    - code_diver_search
    - code_diver_open
    - code_diver_evaluate
    - code_diver_experiment
    - code_diver_tree
    - code_diver_grep
    - code_diver_rg
  extra_args: []

scanner:
  include: []
  exclude: []
  max_file_bytes: 1000000
  chunk_lines: 120

search:
  limit: 10
  preview_lines: 8
  strategy: vector

recursive_search:
  rounds: 2
  branch_limit: 3
  limit: 5

graph:
  enabled: true
  artifact: .code-diver/graph.json
  expansion_depth: 1
  neighbor_limit: 20

ui:
  color: true
  pager: auto
  links: true
  editor:
    command: code
    args:
      - -g
      - "{path}:{line}"

evaluation:
  dataset: datasets/sample_eval.jsonl
  limit: 10

experiments:
  suite: code-diver-local
  strategies:
    - vector
    - recursive
    - graph

metrics:
  enabled: false
  url: http://localhost:18123
  database: code_diver
  username: code_diver
  password: code_diver
  docker_container:
  metrics_table: rag_eval_metrics
  cases_table: rag_eval_cases
  timeout_seconds: 10
  retention_days: 30

plugins: []
